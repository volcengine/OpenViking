metadata:
  id: "semantic.live_context_summary"
  name: "Live Context Node Summary Generation"
  description: "Summarize an MCP-backed live context node and preserve the information an agent needs to invoke its tool"
  version: "1.0.0"
  language: "en"
  category: "semantic"

variables:
  - name: "file_name"
    type: "string"
    description: "Live context node file name"
    required: true

  - name: "title"
    type: "string"
    description: "Live context node title"
    required: true

  - name: "description"
    type: "string"
    description: "Live context node description"
    required: true

  - name: "tool_uri"
    type: "string"
    description: "URI of the MCP Tool definition"
    required: true

  - name: "arguments"
    type: "string"
    description: "JSON object containing the mounted MCP Tool arguments"
    required: true

  - name: "output_language"
    type: "string"
    description: "Language code for output"
    required: true

template: |
  Output Language: {{ output_language }}

  Generate a concise operational summary for this MCP-backed live context node.

  [Node]
  File: {{ file_name }}
  Title: {{ title }}
  MCP Tool URI: {{ tool_uri }}
  Mounted arguments: {{ arguments }}
  Description: {{ description }}

  Output requirements:
  - Output a single plain-text sentence in this exact order: title, tool_uri, args, desc. Introduce the title with "Live context node" rather than a title label. Use commas to connect the fields, not vertical bars. Do not repeat the file name.
  - Use this format: Live context node <title>,tool_uri:<tool_uri>,args:<compact JSON>,desc:<short description>. Translate "Live context node" into {{ output_language }} while keeping the field labels tool_uri, args, and desc unchanged.
  - Preserve the title and exact Tool URI as supplied. Render arguments as compact JSON, preserving every argument name and value, including an empty object.
  - Summarize only the description in {{ output_language }} and place it last, so directory-listing truncation preserves the preceding fields first.
  - If the supplied description is empty, whitespace-only, or a placeholder such as "No description provided", omit the entire desc field and its preceding comma. Do not generate fallback text or infer a description from other fields.
  - Aim for at most 256 characters total, including spaces and punctuation; characters, not words. Shorten or omit the description first. If the first three fields alone exceed the budget, preserve them in full rather than truncating or rewriting them.
  - Omit tool invocation instructions, parameter rules, and repeated-call guidance.
  - Do not invent capabilities, results, or constraints. Do not use Markdown headings or tables.

llm_config:
  temperature: 0.0
