metadata:
  id: "semantic.live_context_summary"
  name: "Live Context Node Summary Generation"
  description: "Summarize a Live Context node for discovery and selection"
  version: "2.0.0"
  language: "en"
  category: "semantic"

variables:
  - name: "file_name"
    type: "string"
    description: "Live context node file name"
    required: true

  - name: "title"
    type: "string"
    description: "Live context node title"
    required: true

  - name: "description"
    type: "string"
    description: "Live context node description"
    required: true

  - name: "tool_uri"
    type: "string"
    description: "URI of the MCP Tool definition"
    required: true

  - name: "arguments"
    type: "string"
    description: "JSON object containing the mounted MCP Tool arguments"
    required: true

  - name: "output_language"
    type: "string"
    description: "Language code for output"
    required: true

  - name: "content"
    type: "string"
    description: "Stored node definition and node-specific guidance, possibly truncated"
    required: true

template: |
  Output Language: {{ output_language }}

  Generate a concise operational summary for this MCP-backed live context node.

  [Node]
  File: {{ file_name }}
  Title: {{ title }}
  Description: {{ description }}
  MCP Tool URI: {{ tool_uri }}
  Mounted arguments: {{ arguments }}
  Definition and node-specific guidance: {{ content }}

  Output requirements:
  - Write 80-180 words in {{ output_language }} as plain text.
  - State the title and description so the node's purpose is immediately clear.
  - Describe the monitored object, metrics, scope, and suitable use cases when supplied.
  - Mention useful defaults only when they help select this node; do not reproduce the full argument object or Tool schema.
  - Focus on business purpose and selection criteria; omit generic read/invocation instructions, tool names, and CLI commands.
  - Do not claim that reading executes a Tool or describe invocation results as supplied live data.
  - Do not invent Tool capabilities, parameters, results, or constraints absent from the supplied node.
  - Do not use Markdown headings or tables.

llm_config:
  temperature: 0.0
