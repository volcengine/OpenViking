metadata:
  id: "semantic.file_summary"
  name: "File Summary Generation"
  description: "Generate summary for a single file in a directory, used for subsequent generation of directory abstract and overview"
  version: "1.0.0"
  language: "en"
  category: "semantic"

variables:
  - name: "file_name"
    type: "string"
    description: "File name"
    required: true

  - name: "content"
    type: "string"
    description: "File content"
    required: true

  - name: "output_language"
    type: "string"
    description: "Language code for output (e.g., 'en', 'zh-CN', 'ja', 'ko', 'ru', 'ar')"
    required: true

template: |
  Output Language: {{ output_language }}

  Please generate a summary for the following file:

  【File Name】
  {{ file_name }}

  【File Content】
  {{ content }}

  Output requirements:
  - Length: 50-150 words
  - Explain what this file is, what it covers, and what it's used for if apparent from the file content
  - Include core keywords from the file content for understanding
  - Output plain text directly, no markdown format
  Faithfulness rules:
  - Describe only what the file content states; do not invent entities, facts, or relationships not present in it.
  - Do not introduce entity names not present in the file content (such as names of people, organizations, companies, products, projects, brands, or places); omit unstated entity relationships rather than guessing.

llm_config:
  temperature: 0.0
