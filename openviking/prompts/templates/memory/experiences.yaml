memory_type: experiences
description: |
  Reusable guidance distilled from execution evidence: key decisions, applicability, checks, and pitfalls.
  Do not retell an execution.

directory: "viking://user/{{ user_space }}/memories/experiences"
filename_template: "{{ experience_name|lower }}.md"
enabled: true
operation_mode: "upsert"
stage: agent
agent_only: true

fields:
  - name: experience_name
    type: string
    description: |
      Name the generalizable pattern, not the specific instance.
      Must be written in {{ language }}.
      {% if language == 'en' %}Use lowercase snake_case, max 5 words.{% else %}Use a concise noun phrase, max 15 characters.{% endif %}
    merge_op: immutable

  - name: reasoning
    type: string
    description: |
      Write before content in {{ language }}. Use three short items, each 1–2 sentences:
      - Evidence: identify unverified assumptions first, then relevant facts supported by policy, user input, or tool observations. Assistant claims and loaded memories are not independent proof.
        Identify the information and authorization required by key actions and how they were obtained, including user additions or corrections.
      - Comparison: compare the same decision point across trajectories using the state, known information, constraints, and available options at that step; match evaluation feedback to actual steps and subsequent observations. Distinguish assistant choices from differences in user requirements or tool state; do not infer causation from outcome differences alone.
      - Conclusion: distinguish supported requirements, conditional options, and unresolved cases. State the reusable condition-action relationships; do not turn an observed choice into a mandatory step or invent rules for unseen cases.
      Evaluation helps locate failures, but does not supply execution-time facts, authorization, or new policy. A passing score, including repeated success on the same case, does not prove an inferred rule.
      With one run, analyze its decision points without inventing a comparison. Keep only the evidence summary; do not audit every step, repeat the body, or include raw payloads.
    merge_op: replace

  - name: content
    type: string
    description: |
      The title and body must be written in {{ language }}.
      Keep the English headings below exactly as written, even when the body uses another language.
      Follow the conclusions in reasoning. A one-sentence title, Situation, and Procedure are required; Anti-pattern is optional. Use only the sections below, in order, and omit empty or redundant sections.

      # <one-sentence title summarizing the reusable method or problem>

      ## Situation
      <Conditions, state, and interface characteristics that determine when the method applies. Include relevant limits; omit task history and broad background.>

      ## Procedure
      <Keep key decisions, actions, and necessary ordering, not a fixed replay.
      For conditional steps, use "When <condition>, <action>" and preserve the user request, prerequisites, and policy limits that justify the action.
      Do not turn an offered option into an automatic action.
      Preserve dependencies; put necessary checks before actions or offers that block remaining work. Omit routine setup, unrelated requests, and instance-specific choices.
      Preserve necessary information gathering, clarification, and confirmation. When required information or authorization is missing, obtain it before acting; do not assume the user will volunteer it.
      Correct evidenced mistakes without discarding valid steps from failed runs. If no established solution exists, retain supported checks and state the limitation.>

      ## Anti-pattern
      <An evidenced wrong action, omission, or misuse and its consequence. A failed score alone does not establish an execution mistake. Do not mechanically negate Procedure.>

      Rules:
      - Keep dependent steps together; split independent methods, not individual actions. A successful run is not a checklist of required steps. There is no fixed quota of experiences or steps.
      - Ground restrictions in the applicable policy or tool constraint. Preserve the operation, target, conditions, allowed alternatives, and exceptions; do not transfer rules across operations because tools or terms overlap. Past user choices are not current defaults or authorization.
      - Generalize instance-specific identifiers, names, dates, amounts, quantities, and raw payloads. Preserve key tool names, parameter semantics, calculation relationships, and ordering constraints needed to use the method. Never include credentials or authentication secrets.
      - Do not add source, retrieval, or locator sections.
    merge_op: replace

  - name: supersedes
    type: string
    description: |
      Set to the old experience_name only when fully replacing a narrower experience under a different name.
      Otherwise leave empty. This is a replacement hint; deletion requires an explicit replacement operation.
    merge_op: replace
