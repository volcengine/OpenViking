memory_type: trajectories
description: |
  A factual execution record of one complete task.

  Extract when the agent worked through identifiable tasks involving decisions, tool calls, or multi-step actions.
  Skip pure chitchat or simple Q&A with no execution trace.

embedding_template: |-
  {{ trajectory_name }}

  {{ retrieval_anchor }}

directory: "viking://user/{{ user_space }}/memories/trajectories"
filename_template: "{{ trajectory_name|lower }}_{{ extract_context.get_session_timestamp() }}{{ extract_context.get_source_archive_suffix() }}.md"
enabled: true
operation_mode: "add_only"
stage: agent
agent_only: true

fields:
  - name: trajectory_name
    type: string
    description: |
      Name the complete task directly and stably, not an individual tool effect or a generalized rule.
      Must be written in {{ language }}.
      {% if language == 'en' %}Use lowercase snake_case, max 5 words.{% else %}Use a concise noun phrase, max 15 characters.{% endif %}
      Do not create near-duplicate names for the same task.
      Good: "duplicate_request_resolution", "async_task_hang_fix", "重复请求处理".
    merge_op: immutable

  - name: outcome
    type: string
    description: |
      Use exactly one of: success, failure, partial, unfinished, unknown.
      Use explicit post-task evaluation when available; otherwise use the observed result.
      Do not claim success merely because a tool was called or the assistant said it succeeded.
    merge_op: immutable

  - name: related_case_ids
    type: string_list
    description: |
      When Candidate Cases are provided, return the IDs of the cases supported by this trajectory in the same extraction response.
      Use only IDs from Candidate Cases; multiple IDs are allowed. Return [] when none match.
      Use the candidate task descriptions only for association. Derive the trajectory from the archived conversation, never invent actions to match a case.
      Do not link every case merely because they share an archive.
      When Candidate Cases are absent, return [].
    merge_op: immutable

  - name: task_query
    type: string
    description: |
      Write a self-contained user task that can be copied and rerun to reproduce the intent represented by this trajectory.

      Rules:
      - Reconstruct the complete task from the relevant conversation context instead of copying unrelated turns or the whole session.
      - Preserve the user's objective, target, constraints, requested output, and acceptance criteria that are necessary to execute the task independently.
      - Preserve non-secret concrete inputs such as the requested topic, time range, and target object when they are required to rerun the task. Never include credentials, tokens, or authentication secrets.
      - Remove conversational references such as "above", "continue", or "why did it stop" by resolving them into explicit task context.
      - Do not include the assistant's solution, tool results, execution outcome, or trajectory analysis.
      - Write concisely in the user's voice and in {{ language }}.
    merge_op: immutable

  - name: retrieval_anchor
    type: string
    description: |
      Positive semantic retrieval text for this record.
      Summarize the task situation, important conditions, target kind, and demonstrated execution capability.

      Rules:
      - Keep it shorter and more retrieval-focused than content.
      - Describe when the record should be retrieved using positive applies-when language only.
      - Do not write negative examples, unrelated alternative requests, or broad exclusions here.
      - Include conditions established during execution when they distinguish this task from similar tasks; do not imply that these conditions were known at the start.
      - Generalize instance-local identifiers, names, dates, places, amounts, and raw tool payloads.
    merge_op: immutable

  - name: content
    type: string
    description: |
      A factual Markdown execution record, written in {{ language }}.

      Global rules:
      - Keep one complete dependent task chain in one record, including prerequisite reads, clarifications, confirmations, writes, verification, and final response. Split only independent tasks; do not add a duplicate whole-session summary.
      - Preserve the key non-secret concrete identifiers, names, dates, amounts, quantities, attributes, tool names, parameters, and returned values. Keep full lists when unchanged items matter. Remove credentials, authentication secrets, and unrelated personal details.
      - Record actual execution; do not add reusable procedures or generalized advice. Omit chitchat, repetition, unrelated large outputs, routine memory retrieval/loading logs, and source/message locator sections.

      Use the structure below in order. Fill placeholders; do not copy extraction instructions into the output.

      # <trajectory_name>
      ## Task and Constraints
      - Complete task: <user goal, reconstructed from subsequent clarification when needed>
      - User constraints: <requested scope, limits, and later additions or confirmations>
      ## Initial State and Policy
      <Keep the three subsections below separate; nest all numbered policy entries under Current policy.>
      ### Current policy
      <Use only explicitly supplied policy text (system policies or policy documents); do not summarize or add interpretations.
      Agent explanations, retrieved guidance, and evaluator reference answers are not policy sources.
      Preserve conditions, rules, permitted alternatives, and exceptions. Translate when needed without changing meaning.
      Keep each excerpt under the operation and target it originally governs; do not transfer restrictions between operations. Write each excerpt as a blockquote.
      Omit unsupported fields; absence of a rule implies neither permission nor prohibition.
      Repeat numbered entries for relevant operations and record shared clauses once. If no policy was supplied, write "Not provided" under Current policy.>
      #### Policy 1
      - Operation and target: <the operation and object named in the original policy>
      - Applies when:
        > <policy excerpt stating the applicable status, prerequisites, or trigger>
      - Rules:
        > <policy excerpt stating required, allowed, or prohibited behavior, including permitted alternatives>
      - Exceptions and limits:
        > <policy excerpt stating exceptions or limits>
      ### Initially known
      - <facts available when the task began; later discoveries must not be backfilled into the initial state>
      ### Initially unknown
      - <information missing at the start and needed for execution, or none>
      ## Execution Chain
      <Repeat numbered steps in actual execution order, preserving failed attempts, tool errors, retries, and recovery that changed the route.
      Do not rewrite a failed route as a successful procedure or invent a correction.
      Use only information available at each step; refer to earlier steps in plain language, not source-message IDs.
      Include an Agent-stated judgment only when explicitly expressed and relevant to the action. Never infer hidden reasoning or reproduce private chain-of-thought.>
      For each step, include both Basis and Assistant information.
      Write "Not provided" when either has no relevant information.
      Classify by source, not by wording such as "per policy".
      ### Step 1: <actual action or interaction>
      - Before: <relevant state immediately before this step>
      - Basis: <explicitly supplied policy and user requirements or confirmations only. Do not include retrieved Memory or assistant claims.>
      - Assistant information: <relevant tool results, retrieved Memory with its URI, and assistant claims. Include information referenced in this step even if recorded earlier.>
      - Deviation: <compare the two under the same operation and conditions. State contradictions or restrictions unsupported by Basis. Omit if none.>
      - Action: <actual user interaction or tool name with the key parameters>
      - Observation: <actual user reply or relevant tool result, including errors or missing receipts>
      - State change: <what became known, changed, completed, or blocked>
      ## Actual Result
      <Distinguish attempted calls, observed changes, and completion reported to the user. State unknowns when evidence is missing.>
      - Completed: <what the observations establish, not merely what was attempted>
      - Preserved state: <important fields, objects, or constraints that stayed unchanged, when verified>
      - Outstanding: <unfinished or blocked work, or none>
      <!-- POST_TASK_EVALUATION -->
      ## Post-task Evaluation
      <Record each distinct evaluation fact once; never use it as execution-time knowledge.
      Keep the evaluator's verdict separate from the observed actual result when they disagree.
      Preserve the preceding marker. Omit both the marker and this section when no evaluation was supplied.>
      - <supplied score, verdict, and relevant checks or feedback>
    merge_op: patch
