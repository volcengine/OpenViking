<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 820" width="1240" height="820">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000000" flood-opacity="0.1"/>
    </filter>
    <marker id="arrB" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4A90D9"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#50B86A"/>
    </marker>
    <marker id="arrO" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#E8A838"/>
    </marker>
    <marker id="arrGr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7F8C8D"/>
    </marker>
  </defs>

  <rect width="1240" height="820" fill="#FAFBFC"/>

  <text x="30" y="36" font-family="Noto Sans SC, sans-serif" font-size="18" font-weight="700" fill="#1F2937">从 Session 出发的抽取流水线全景</text>
  <text x="30" y="56" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#6B7280">Session 是原材料入口，多条流水线并行/串行处理，有的单阶段直接提取，有的多阶段逐级蒸馏</text>

  <!-- Session input card -->
  <rect x="30" y="370" width="160" height="100" rx="8" fill="#1F2937" stroke="#1F2937" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="110" y="400" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Session</text>
  <text x="110" y="422" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#D1D5DB">会话消息 + 工具输出</text>
  <text x="110" y="440" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#9CA3AF">（原材料入口）</text>

  <!-- Lane labels -->
  <rect x="210" y="80" width="100" height="22" rx="4" fill="#4A90D9"/>
  <text x="260" y="95" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">多阶段流水线</text>

  <rect x="210" y="230" width="100" height="22" rx="4" fill="#50B86A"/>
  <text x="260" y="245" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">单阶段 LLM 抽取</text>

  <rect x="210" y="620" width="100" height="22" rx="4" fill="#E8A838"/>
  <text x="260" y="635" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">直接记录（无 LLM）</text>

  <rect x="210" y="700" width="100" height="22" rx="4" fill="#7F8C8D"/>
  <text x="260" y="715" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">辅助流水线</text>

  <!-- ===== 多阶段流水线：session → trajectory → experience ===== -->
  <!-- Phase 1: trajectory extraction -->
  <rect x="340" y="110" width="180" height="80" rx="8" fill="#FFFFFF" stroke="#4A90D9" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="340" y="110" width="180" height="28" rx="8" fill="#4A90D9"/>
  <rect x="340" y="130" width="180" height="8" fill="#4A90D9"/>
  <text x="430" y="129" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">Phase 1：Trajectory 提取</text>
  <text x="354" y="156" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#475569">AgentTrajectoryContextProvider</text>
  <text x="354" y="174" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#475569">输入：归档消息 + rubric 评估</text>

  <!-- trajectory output -->
  <rect x="560" y="115" width="170" height="70" rx="8" fill="#EBF3FB" stroke="#4A90D9" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="645" y="142" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="12" font-weight="700" fill="#2563EB">memories/trajectories/</text>
  <text x="574" y="162" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#475569">{name}_{timestamp}.md</text>
  <text x="574" y="178" font-family="Noto Sans SC, sans-serif" font-size="10" fill="#9CA3AF">add_only · 可复用操作契约</text>

  <!-- Phase 2: experience extraction -->
  <rect x="780" y="110" width="180" height="80" rx="8" fill="#FFFFFF" stroke="#4A90D9" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="780" y="110" width="180" height="28" rx="8" fill="#4A90D9"/>
  <rect x="780" y="130" width="180" height="8" fill="#4A90D9"/>
  <text x="870" y="129" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">Phase 2：Experience 提取</text>
  <text x="794" y="156" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#475569">AgentExperienceContextProvider</text>
  <text x="794" y="174" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#475569">输入：trajectory + 候选经验对比</text>

  <!-- experience output -->
  <rect x="1000" y="115" width="170" height="70" rx="8" fill="#EBF3FB" stroke="#4A90D9" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1085" y="142" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="12" font-weight="700" fill="#2563EB">memories/experiences/</text>
  <text x="1014" y="162" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#475569">{name}.md · upsert</text>
  <text x="1014" y="178" font-family="Noto Sans SC, sans-serif" font-size="10" fill="#9CA3AF">Situation/Approach/Reflect</text>

  <!-- Arrows for multi-stage pipeline -->
  <line x1="190" y1="400" x2="330" y2="150" stroke="#4A90D9" stroke-width="1.5"/>
  <line x1="520" y1="150" x2="556" y2="150" stroke="#4A90D9" stroke-width="1.5" marker-end="url(#arrB)"/>
  <line x1="730" y1="150" x2="776" y2="150" stroke="#4A90D9" stroke-width="1.5" marker-end="url(#arrB)"/>
  <line x1="960" y1="150" x2="996" y2="150" stroke="#4A90D9" stroke-width="1.5" marker-end="url(#arrB)"/>
  <!-- trajectory -> experience derived_from -->
  <path d="M 645 185 L 645 210 L 870 210 L 870 190" stroke="#4A90D9" stroke-width="1" stroke-dasharray="4,3" fill="none"/>
  <text x="680" y="205" font-family="Noto Sans SC, sans-serif" font-size="10" fill="#4A90D9">derived_from 血缘</text>

  <!-- ===== 单阶段 LLM 抽取流水线 ===== -->
  <!-- profile/identity/soul -->
  <rect x="340" y="260" width="180" height="60" rx="8" fill="#FFFFFF" stroke="#50B86A" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="340" y="260" width="180" height="24" rx="8" fill="#50B86A"/>
  <rect x="340" y="276" width="180" height="8" fill="#50B86A"/>
  <text x="430" y="277" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">LLM 抽取</text>
  <text x="354" y="300" font-family="Noto Sans SC, sans-serif" font-size="10" fill="#475569">StreamingMemoryUpdater</text>
  <text x="354" y="314" font-family="Noto Sans SC, sans-serif" font-size="10" fill="#9CA3AF">实时流式 / 批量</text>

  <rect x="560" y="265" width="200" height="50" rx="8" fill="#EAF7EE" stroke="#50B86A" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="660" y="288" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="11" font-weight="700" fill="#2E7D46">profile.md / identity.md / soul.md</text>
  <text x="574" y="306" font-family="Noto Sans SC, sans-serif" font-size="10" fill="#475569">单文件 · upsert · 用户画像/身份/性格</text>

  <!-- preferences -->
  <rect x="340" y="335" width="180" height="55" rx="8" fill="#FFFFFF" stroke="#50B86A" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="340" y="335" width="180" height="24" rx="8" fill="#50B86A"/>
  <rect x="340" y="351" width="180" height="8" fill="#50B86A"/>
  <text x="430" y="352" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">LLM 抽取</text>
  <text x="354" y="378" font-family="Noto Sans SC, sans-serif" font-size="10" fill="#475569">识别稳定偏好时 upsert</text>

  <rect x="560" y="338" width="200" height="48" rx="8" fill="#EAF7EE" stroke="#50B86A" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="660" y="360" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="11" font-weight="700" fill="#2E7D46">memories/preferences/</text>
  <text x="574" y="378" font-family="Noto Sans SC, sans-serif" font-size="10" fill="#475569">{user}/{topic}.md · patch 合并</text>

  <!-- entities -->
  <rect x="340" y="405" width="180" height="55" rx="8" fill="#FFFFFF" stroke="#50B86A" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="340" y="405" width="180" height="24" rx="8" fill="#50B86A"/>
  <rect x="340" y="421" width="180" height="8" fill="#50B86A"/>
  <text x="430" y="422" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">LLM 抽取</text>
  <text x="354" y="448" font-family="Noto Sans SC, sans-serif" font-size="10" fill="#475569">沉淀稳定实体时创建/patch</text>

  <rect x="560" y="408" width="200" height="48" rx="8" fill="#EAF7EE" stroke="#50B86A" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="660" y="430" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="11" font-weight="700" fill="#2E7D46">memories/entities/</text>
  <text x="574" y="448" font-family="Noto Sans SC, sans-serif" font-size="10" fill="#475569">{category}/{name}.md · patch 合并</text>

  <!-- cases -->
  <rect x="340" y="475" width="180" height="55" rx="8" fill="#FFFFFF" stroke="#50B86A" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="340" y="475" width="180" height="24" rx="8" fill="#50B86A"/>
  <rect x="340" y="491" width="180" height="8" fill="#50B86A"/>
  <text x="430" y="492" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">LLM 抽取</text>
  <text x="354" y="518" font-family="Noto Sans SC, sans-serif" font-size="10" fill="#475569">典型用例沉淀</text>

  <rect x="560" y="478" width="200" height="48" rx="8" fill="#EAF7EE" stroke="#50B86A" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="660" y="500" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="11" font-weight="700" fill="#2E7D46">memories/cases/</text>
  <text x="574" y="518" font-family="Noto Sans SC, sans-serif" font-size="10" fill="#475569">{timestamp}_{slug}.md · add_only</text>

  <!-- Arrows for single-stage pipelines -->
  <line x1="190" y1="390" x2="336" y2="290" stroke="#50B86A" stroke-width="1.5"/>
  <line x1="520" y1="290" x2="556" y2="290" stroke="#50B86A" stroke-width="1.5" marker-end="url(#arrG)"/>
  <line x1="190" y1="400" x2="336" y2="362" stroke="#50B86A" stroke-width="1.5"/>
  <line x1="520" y1="362" x2="556" y2="362" stroke="#50B86A" stroke-width="1.5" marker-end="url(#arrG)"/>
  <line x1="190" y1="410" x2="336" y2="432" stroke="#50B86A" stroke-width="1.5"/>
  <line x1="520" y1="432" x2="556" y2="432" stroke="#50B86A" stroke-width="1.5" marker-end="url(#arrG)"/>
  <line x1="190" y1="420" x2="336" y2="502" stroke="#50B86A" stroke-width="1.5"/>
  <line x1="520" y1="502" x2="556" y2="502" stroke="#50B86A" stroke-width="1.5" marker-end="url(#arrG)"/>

  <!-- ===== 直接记录（无 LLM）===== -->
  <rect x="340" y="650" width="180" height="55" rx="8" fill="#FFFFFF" stroke="#E8A838" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="340" y="650" width="180" height="24" rx="8" fill="#E8A838"/>
  <rect x="340" y="666" width="180" height="8" fill="#E8A838"/>
  <text x="430" y="667" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">直接记录</text>
  <text x="354" y="693" font-family="Noto Sans SC, sans-serif" font-size="10" fill="#475569">无需 LLM，按日期落盘</text>

  <rect x="560" y="653" width="200" height="48" rx="8" fill="#FDF3E3" stroke="#E8A838" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="660" y="675" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="11" font-weight="700" fill="#9A6B14">memories/events/</text>
  <text x="574" y="693" font-family="Noto Sans SC, sans-serif" font-size="10" fill="#475569">{YYYY}/{MM}/{DD}/{event_name}.md · immutable</text>

  <line x1="190" y1="440" x2="336" y2="677" stroke="#E8A838" stroke-width="1.5"/>
  <line x1="520" y1="677" x2="556" y2="677" stroke="#E8A838" stroke-width="1.5" marker-end="url(#arrO)"/>

  <!-- ===== 辅助流水线 ===== -->
  <rect x="340" y="730" width="180" height="55" rx="8" fill="#FFFFFF" stroke="#7F8C8D" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="340" y="730" width="180" height="24" rx="8" fill="#7F8C8D"/>
  <rect x="340" y="746" width="180" height="8" fill="#7F8C8D"/>
  <text x="430" y="747" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">WM 摘要 + hydrate</text>
  <text x="354" y="773" font-family="Noto Sans SC, sans-serif" font-size="10" fill="#475569">Commit Phase 2 并行任务</text>

  <rect x="560" y="733" width="200" height="48" rx="8" fill="#F3F4F6" stroke="#7F8C8D" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="660" y="755" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="11" font-weight="700" fill="#4B5563">.overview / .abstract</text>
  <text x="574" y="773" font-family="Noto Sans SC, sans-serif" font-size="10" fill="#475569">工作记忆摘要 · 工具输出补全</text>

  <line x1="190" y1="450" x2="336" y2="757" stroke="#7F8C8D" stroke-width="1.5"/>
  <line x1="520" y1="757" x2="556" y2="757" stroke="#7F8C8D" stroke-width="1.5" marker-end="url(#arrGr)"/>

  <!-- Bottom note -->
  <text x="30" y="805" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#6B7280">注：trajectory → experience 是唯一的两阶段流水线；其余记忆类型均为单阶段直接提取；events 无需 LLM，直接按日期记录</text>
</svg>