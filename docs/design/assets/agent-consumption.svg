<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560">
  <defs>
    <filter id="shadow4" x="-3%" y="-3%" width="106%" height="108%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000000" flood-opacity="0.1"/>
    </filter>
  </defs>

  <rect width="900" height="560" fill="#FAFBFC"/>

  <!-- 标题 -->
  <text x="450" y="35" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#1E293B">Agent 消费 viking://resources 的完整链路</text>
  <text x="450" y="55" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#64748B">通过 MCP 协议连接，支持工具调用 + 上下文自动注入两种模式</text>

  <!-- ===== Agent 端 ===== -->
  <g>
    <rect x="40" y="90" width="200" height="420" rx="14" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.5" filter="url(#shadow4)"/>
    <rect x="40" y="90" width="200" height="48" rx="14" fill="#3B82F6"/>
    <rect x="40" y="124" width="200" height="14" fill="#3B82F6"/>
    <text x="140" y="120" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">Agent 端</text>

    <!-- Agent 列表 -->
    <g font-family="Noto Sans SC, sans-serif">
      <rect x="60" y="160" width="160" height="40" rx="8" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
      <text x="140" y="184" text-anchor="middle" font-size="13" font-weight="700" fill="#1E40AF">Codex CLI</text>

      <rect x="60" y="212" width="160" height="40" rx="8" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
      <text x="140" y="236" text-anchor="middle" font-size="13" font-weight="700" fill="#1E40AF">Claude Code</text>

      <rect x="60" y="264" width="160" height="40" rx="8" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
      <text x="140" y="288" text-anchor="middle" font-size="13" font-weight="700" fill="#1E40AF">Cursor / Cline</text>

      <rect x="60" y="316" width="160" height="40" rx="8" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
      <text x="140" y="340" text-anchor="middle" font-size="13" font-weight="700" fill="#1E40AF">OpenViking Agent</text>

      <rect x="60" y="368" width="160" height="40" rx="8" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
      <text x="140" y="392" text-anchor="middle" font-size="13" font-weight="700" fill="#1E40AF">自定义 Agent</text>

      <text x="140" y="440" text-anchor="middle" font-size="11" fill="#64748B">任何支持 MCP 协议</text>
      <text x="140" y="456" text-anchor="middle" font-size="11" fill="#64748B">的 Agent 均可接入</text>
      <text x="140" y="480" text-anchor="middle" font-size="11" fill="#64748B">对话时自动注入上下文</text>
    </g>
  </g>

  <!-- 箭头 Agent → MCP -->
  <g>
    <line x1="250" y1="300" x2="310" y2="300" stroke="#94A3B8" stroke-width="2.5"/>
    <polygon points="310,293 324,300 310,307" fill="#94A3B8"/>
    <rect x="260" y="278" width="60" height="18" rx="4" fill="#F1F5F9"/>
    <text x="290" y="291" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="10" fill="#64748B">MCP 协议</text>
  </g>

  <!-- ===== MCP 工具层 ===== -->
  <g>
    <rect x="330" y="90" width="220" height="420" rx="14" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="1.5" filter="url(#shadow4)"/>
    <rect x="330" y="90" width="220" height="48" rx="14" fill="#8B5CF6"/>
    <rect x="330" y="124" width="220" height="14" fill="#8B5CF6"/>
    <text x="440" y="120" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">MCP 工具层</text>

    <g font-family="Noto Sans SC, sans-serif">
      <!-- search -->
      <rect x="350" y="155" width="180" height="50" rx="8" fill="#F5F3FF" stroke="#DDD6FE" stroke-width="1"/>
      <text x="362" y="175" font-size="12" font-weight="700" fill="#5B21B6">search</text>
      <text x="362" y="192" font-size="10" fill="#475569">深度语义检索</text>
      <text x="362" y="204" font-size="10" fill="#475569">list / context 双模式</text>

      <!-- read -->
      <rect x="350" y="215" width="85" height="40" rx="8" fill="#F5F3FF" stroke="#DDD6FE" stroke-width="1"/>
      <text x="392" y="175" font-size="12" font-weight="700" fill="#5B21B6">read</text>
      <text x="392" y="240" text-anchor="middle" font-size="11" fill="#475569">读取文件</text>

      <!-- tree -->
      <rect x="445" y="215" width="85" height="40" rx="8" fill="#F5F3FF" stroke="#DDD6FE" stroke-width="1"/>
      <text x="487" y="240" text-anchor="middle" font-size="12" font-weight="700" fill="#5B21B6">tree</text>
      <text x="487" y="252" text-anchor="middle" font-size="10" fill="#475569">浏览目录</text>

      <!-- write -->
      <rect x="350" y="265" width="85" height="40" rx="8" fill="#F5F3FF" stroke="#DDD6FE" stroke-width="1"/>
      <text x="392" y="290" text-anchor="middle" font-size="12" font-weight="700" fill="#5B21B6">write</text>
      <text x="392" y="302" text-anchor="middle" font-size="10" fill="#475569">写文件</text>

      <!-- edit -->
      <rect x="445" y="265" width="85" height="40" rx="8" fill="#F5F3FF" stroke="#DDD6FE" stroke-width="1"/>
      <text x="487" y="290" text-anchor="middle" font-size="12" font-weight="700" fill="#5B21B6">edit</text>
      <text x="487" y="302" text-anchor="middle" font-size="10" fill="#475569">精确编辑</text>

      <!-- add_resource -->
      <rect x="350" y="315" width="180" height="50" rx="8" fill="#F5F3FF" stroke="#DDD6FE" stroke-width="1"/>
      <text x="362" y="335" font-size="12" font-weight="700" fill="#5B21B6">add_resource</text>
      <text x="362" y="352" font-size="10" fill="#475569">摄取新资源（本地文件自动上传）</text>

      <text x="440" y="395" text-anchor="middle" font-size="11" fill="#64748B">工具调用 = 显式消费</text>
      <text x="440" y="415" text-anchor="middle" font-size="11" fill="#64748B">Agent 主动调用，按需获取</text>
      <text x="440" y="440" text-anchor="middle" font-size="11" fill="#64748B">支持 read_content 自动读取</text>
      <text x="440" y="460" text-anchor="middle" font-size="11" fill="#64748B">支持 context 模式直接注入</text>
    </g>
  </g>

  <!-- 箭头 MCP → OpenViking -->
  <g>
    <line x1="560" y1="300" x2="620" y2="300" stroke="#94A3B8" stroke-width="2.5"/>
    <polygon points="620,293 634,300 620,307" fill="#94A3B8"/>
  </g>

  <!-- ===== OpenViking 服务 ===== -->
  <g>
    <rect x="640" y="90" width="220" height="420" rx="14" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1.5" filter="url(#shadow4)"/>
    <rect x="640" y="90" width="220" height="48" rx="14" fill="#10B981"/>
    <rect x="640" y="124" width="220" height="14" fill="#10B981"/>
    <text x="750" y="120" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">OpenViking 服务</text>

    <g font-family="Noto Sans SC, sans-serif">
      <!-- 检索服务 -->
      <rect x="660" y="155" width="180" height="50" rx="8" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1"/>
      <text x="672" y="175" font-size="12" font-weight="700" fill="#065F46">SearchService</text>
      <text x="672" y="192" font-size="10" fill="#475569">向量检索 + 意图分析</text>
      <text x="672" y="204" font-size="10" fill="#475569">查询扩展 + 重排序</text>

      <!-- 上下文组装 -->
      <rect x="660" y="215" width="180" height="50" rx="8" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1"/>
      <text x="672" y="235" font-size="12" font-weight="700" fill="#065F46">ContextAssembler</text>
      <text x="672" y="252" font-size="10" fill="#475569">自动检索 + 配额控制</text>
      <text x="672" y="264" font-size="10" fill="#475569">token 预算 + 详情层级</text>

      <!-- FS 服务 -->
      <rect x="660" y="275" width="180" height="50" rx="8" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1"/>
      <text x="672" y="295" font-size="12" font-weight="700" fill="#065F46">FSService</text>
      <text x="672" y="312" font-size="10" fill="#475569">文件读写 + 目录浏览</text>
      <text x="672" y="324" font-size="10" fill="#475569">写入后自动索引刷新</text>

      <!-- 资源服务 -->
      <rect x="660" y="335" width="180" height="50" rx="8" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1"/>
      <text x="672" y="355" font-size="12" font-weight="700" fill="#065F46">ResourceService</text>
      <text x="672" y="372" font-size="10" fill="#475569">资源摄取 + 解析 + 后处理</text>
      <text x="672" y="384" font-size="10" fill="#475569">两阶段提交</text>

      <!-- viking://resources -->
      <rect x="660" y="405" width="180" height="50" rx="8" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
      <text x="750" y="428" text-anchor="middle" font-size="13" font-weight="700" fill="#065F46">viking://resources</text>
      <text x="750" y="446" text-anchor="middle" font-size="10" fill="#047857">全局共享知识库</text>
    </g>
  </g>

  <!-- 底部：上下文自动注入（虚线，从 OpenViking 回到 Agent） -->
  <g>
    <path d="M 750 510 Q 750 535 700 535 L 200 535 Q 150 535 150 510" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6,4"/>
    <polygon points="150,510 143,520 157,520" fill="#94A3B8"/>
    <rect x="380" y="520" width="240" height="22" rx="6" fill="#F1F5F9"/>
    <text x="500" y="535" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#475569">对话时上下文自动注入（无需 Agent 主动调用）</text>
  </g>
</svg>
