<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 580" width="720" height="580">
  <defs>
    <filter id="shadow3" x="-3%" y="-3%" width="106%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="720" height="580" fill="#FAFBFC"/>

  <!-- 标题 -->
  <text x="360" y="35" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#1E293B">删除时的联动处理流程</text>
  <text x="360" y="55" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#64748B">FSService.rm() 触发，自动级联清理所有关联状态</text>

  <!-- 步骤1 -->
  <g>
    <rect x="80" y="80" width="560" height="60" rx="10" fill="#FFFFFF" stroke="#FECACA" stroke-width="1.5" filter="url(#shadow3)"/>
    <circle cx="110" cy="110" r="18" fill="#EF4444"/>
    <text x="110" y="116" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">1</text>
    <text x="142" y="104" font-family="Noto Sans SC, sans-serif" font-size="14" font-weight="700" fill="#991B1B">VikingFS 删除文件/目录</text>
    <text x="142" y="124" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#475569">POST /api/v1/content/rm，支持 recursive=true 递归删除</text>
  </g>

  <!-- 连接线 -->
  <line x1="360" y1="140" x2="360" y2="155" stroke="#CBD5E1" stroke-width="2"/>

  <!-- 步骤2 -->
  <g>
    <rect x="80" y="155" width="560" height="60" rx="10" fill="#FFFFFF" stroke="#FDBA74" stroke-width="1.5" filter="url(#shadow3)"/>
    <circle cx="110" cy="185" r="18" fill="#F97316"/>
    <text x="110" y="191" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">2</text>
    <text x="142" y="179" font-family="Noto Sans SC, sans-serif" font-size="14" font-weight="700" fill="#9A3412">Watch 联动停用</text>
    <text x="142" y="199" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#475569">_sync_watch_after_rm() → 自动停用目标被删除的 Watch 任务（配置保留，可手动重新激活）</text>
  </g>

  <line x1="360" y1="215" x2="360" y2="230" stroke="#CBD5E1" stroke-width="2"/>

  <!-- 步骤3 -->
  <g>
    <rect x="80" y="230" width="560" height="60" rx="10" fill="#FFFFFF" stroke="#FCD34D" stroke-width="1.5" filter="url(#shadow3)"/>
    <circle cx="110" cy="260" r="18" fill="#EAB308"/>
    <text x="110" y="266" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">3</text>
    <text x="142" y="254" font-family="Noto Sans SC, sans-serif" font-size="14" font-weight="700" fill="#854D0E">父目录语义刷新入队</text>
    <text x="142" y="274" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#475569">_enqueue_delete_refresh() → 父目录 .abstract.md 标记为待刷新，后台异步重新生成</text>
  </g>

  <line x1="360" y1="290" x2="360" y2="305" stroke="#CBD5E1" stroke-width="2"/>

  <!-- 步骤4 -->
  <g>
    <rect x="80" y="305" width="560" height="60" rx="10" fill="#FFFFFF" stroke="#86EFAC" stroke-width="1.5" filter="url(#shadow3)"/>
    <circle cx="110" cy="335" r="18" fill="#22C55E"/>
    <text x="110" y="341" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">4</text>
    <text x="142" y="329" font-family="Noto Sans SC, sans-serif" font-size="14" font-weight="700" fill="#166534">记忆链接清理</text>
    <text x="142" y="349" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#475569">resource_memory_link_service.before_resource_delete() → 清理关联的记忆链接，防止悬空引用</text>
  </g>

  <line x1="360" y1="365" x2="360" y2="380" stroke="#CBD5E1" stroke-width="2"/>

  <!-- 步骤5 -->
  <g>
    <rect x="80" y="380" width="560" height="60" rx="10" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.5" filter="url(#shadow3)"/>
    <circle cx="110" cy="410" r="18" fill="#3B82F6"/>
    <text x="110" y="416" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">5</text>
    <text x="142" y="404" font-family="Noto Sans SC, sans-serif" font-size="14" font-weight="700" fill="#1E40AF">目录概览更新</text>
    <text x="142" y="424" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#475569">MemoryUpdater.refresh_schema_overview() → 更新目录结构概览，保持 schema 与实际一致</text>
  </g>

  <line x1="360" y1="440" x2="360" y2="455" stroke="#CBD5E1" stroke-width="2"/>

  <!-- 步骤6 -->
  <g>
    <rect x="80" y="455" width="560" height="60" rx="10" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="1.5" filter="url(#shadow3)"/>
    <circle cx="110" cy="485" r="18" fill="#8B5CF6"/>
    <text x="110" y="491" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">6</text>
    <text x="142" y="479" font-family="Noto Sans SC, sans-serif" font-size="14" font-weight="700" fill="#5B21B6">向量索引异步删除</text>
    <text x="142" y="499" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#475569">VikingDB 中对应记录异步删除，保持向量索引与存储一致</text>
  </g>

  <!-- 底部说明 -->
  <rect x="140" y="535" width="440" height="32" rx="8" fill="#F1F5F9"/>
  <text x="360" y="555" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#475569">所有联动处理自动触发，无需用户手动操作</text>
</svg>
