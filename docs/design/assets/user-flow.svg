<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 760" width="1240" height="760">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000000" flood-opacity="0.1"/>
    </filter>
    <marker id="arrB" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4A90D9"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#50B86A"/>
    </marker>
    <marker id="arrO" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#E8A838"/>
    </marker>
    <marker id="arrGr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7F8C8D"/>
    </marker>
  </defs>

  <rect width="1240" height="760" fill="#FAFBFC"/>

  <!-- Phase group boxes (behind content) -->
  <rect x="20" y="118" width="684" height="148" rx="10" fill="#EBF3FB" stroke="#4A90D9" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="36" y="136" font-family="Noto Sans SC, sans-serif" font-size="11" font-weight="700" fill="#4A90D9">阶段一：Session 写入与提交</text>

  <rect x="628" y="308" width="470" height="148" rx="10" fill="#EAF7EE" stroke="#50B86A" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="644" y="326" font-family="Noto Sans SC, sans-serif" font-size="11" font-weight="700" fill="#50B86A">阶段二：Phase 1 轨迹提取</text>

  <rect x="628" y="548" width="470" height="158" rx="10" fill="#FDF3E3" stroke="#E8A838" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="644" y="566" font-family="Noto Sans SC, sans-serif" font-size="11" font-weight="700" fill="#E8A838">阶段三：Phase 2 经验提取</text>

  <text x="30" y="36" font-family="Noto Sans SC, sans-serif" font-size="18" font-weight="700" fill="#1F2937">session → trajectory → experience 流转链路</text>
  <text x="30" y="56" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#6B7280">会话提交两阶段 commit：Phase 1 同步归档，Phase 2 异步抽取记忆；trajectory 作为 experience 的输入</text>

  <!-- 1. Session -->
  <rect x="30" y="130" width="180" height="120" rx="8" fill="#FFFFFF" stroke="#4A90D9" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="30" y="130" width="180" height="34" rx="8" fill="#4A90D9"/>
  <rect x="30" y="156" width="180" height="8" fill="#4A90D9"/>
  <text x="120" y="152" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Session</text>
  <text x="44" y="184" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#475569">messages.jsonl</text>
  <text x="44" y="202" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#475569">每条消息 append_file</text>
  <text x="44" y="220" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#475569">持 AGFS PathLock 实时追加</text>
  <text x="44" y="238" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#9CA3AF">pending_tokens&gt;150k 等触发</text>

  <!-- arrow to Phase1 -->
  <line x1="210" y1="190" x2="248" y2="190" stroke="#4A90D9" stroke-width="1.5" marker-end="url(#arrB)"/>

  <!-- 2. Commit Phase1 -->
  <rect x="252" y="130" width="190" height="120" rx="8" fill="#FFFFFF" stroke="#4A90D9" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="252" y="130" width="190" height="34" rx="8" fill="#4A90D9"/>
  <rect x="252" y="156" width="190" height="8" fill="#4A90D9"/>
  <text x="347" y="152" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Commit Phase 1</text>
  <text x="266" y="184" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#475569">同步持锁 · retention 选边界</text>
  <text x="266" y="202" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#475569">写 archive_NNN/messages.jsonl</text>
  <text x="266" y="220" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#475569">根 messages.jsonl 重写为 retained</text>
  <text x="266" y="238" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#9CA3AF">入队 QueueFS</text>

  <!-- arrow to Phase2 -->
  <line x1="442" y1="190" x2="480" y2="190" stroke="#4A90D9" stroke-width="1.5" marker-end="url(#arrB)"/>

  <!-- 3. Commit Phase2 -->
  <rect x="484" y="130" width="200" height="120" rx="8" fill="#FFFFFF" stroke="#4A90D9" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="484" y="130" width="200" height="34" rx="8" fill="#4A90D9"/>
  <rect x="484" y="156" width="200" height="8" fill="#4A90D9"/>
  <text x="584" y="152" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Commit Phase 2</text>
  <text x="498" y="184" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#475569">异步 worker（重启安全）</text>
  <text x="498" y="202" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#475569">hydrate 工具输出 + 并行：</text>
  <text x="498" y="220" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#475569">WM 摘要(.overview/.abstract)</text>
  <text x="498" y="238" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#475569">+ 长期记忆抽取 → 写 .done</text>

  <!-- fork up to trajectory lane -->
  <line x1="584" y1="250" x2="584" y2="290" stroke="#50B86A" stroke-width="1.5"/>
  <line x1="584" y1="290" x2="720" y2="290" stroke="#50B86A" stroke-width="1.5"/>
  <line x1="720" y1="290" x2="720" y2="320" stroke="#50B86A" stroke-width="1.5" marker-end="url(#arrG)"/>
  <text x="600" y="284" font-family="Noto Sans SC, sans-serif" font-size="10" fill="#50B86A">归档消息列表(含 tool_parts)</text>

  <!-- fork down to experience lane -->
  <line x1="540" y1="250" x2="540" y2="430" stroke="#E8A838" stroke-width="1.5"/>
  <line x1="540" y1="430" x2="640" y2="430" stroke="#E8A838" stroke-width="1.5"/>
  <line x1="640" y1="430" x2="640" y2="560" stroke="#E8A838" stroke-width="1.5" marker-end="url(#arrO)"/>

  <!-- 4. Phase1 Trajectory extraction -->
  <rect x="640" y="320" width="220" height="130" rx="8" fill="#FFFFFF" stroke="#50B86A" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="640" y="320" width="220" height="34" rx="8" fill="#50B86A"/>
  <rect x="640" y="346" width="220" height="8" fill="#50B86A"/>
  <text x="750" y="342" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Phase 1 轨迹提取</text>
  <text x="654" y="374" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#475569">AgentTrajectoryContextProvider</text>
  <text x="654" y="392" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#475569">输入：归档消息 + rubric 评估</text>
  <text x="654" y="410" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#475569">输出：12 段操作契约（状态-动作）</text>
  <text x="654" y="428" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#9CA3AF">add_only · 不更新历史</text>

  <!-- arrow to memories/trajectories -->
  <line x1="860" y1="385" x2="898" y2="385" stroke="#50B86A" stroke-width="1.5" marker-end="url(#arrG)"/>

  <!-- 5. memories/trajectories -->
  <rect x="902" y="330" width="180" height="110" rx="8" fill="#EAF7EE" stroke="#50B86A" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="992" y="356" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="13" font-weight="700" fill="#2E7D46">memories/trajectories/</text>
  <text x="916" y="382" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#475569">{name}_{timestamp}.md</text>
  <text x="916" y="400" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#475569">outcome: success/failure/…</text>
  <text x="916" y="418" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#9CA3AF">作为 Phase 2 输入</text>

  <!-- 6. Phase2 Experience extraction -->
  <rect x="640" y="560" width="220" height="140" rx="8" fill="#FFFFFF" stroke="#E8A838" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="640" y="560" width="220" height="34" rx="8" fill="#E8A838"/>
  <rect x="640" y="586" width="220" height="8" fill="#E8A838"/>
  <text x="750" y="582" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Phase 2 经验提取</text>
  <text x="654" y="614" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#475569">AgentExperienceContextProvider</text>
  <text x="654" y="632" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#475569">向量检索 top-5 候选 experiences</text>
  <text x="654" y="650" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#475569">top-3 候选附带源 trajectory</text>
  <text x="654" y="668" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#475569">新轨迹 summary + 候选对比</text>
  <text x="654" y="686" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#9CA3AF">split over merge · upsert</text>

  <!-- arrow to memories/experiences -->
  <line x1="860" y1="630" x2="898" y2="630" stroke="#E8A838" stroke-width="1.5" marker-end="url(#arrO)"/>

  <!-- 7. memories/experiences -->
  <rect x="902" y="570" width="180" height="120" rx="8" fill="#FDF3E3" stroke="#E8A838" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="992" y="596" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="13" font-weight="700" fill="#9A6B14">memories/experiences/</text>
  <text x="916" y="622" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#475569">{name}.md · upsert</text>
  <text x="916" y="640" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#475569">Situation/Approach/Reflect</text>
  <text x="916" y="658" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#475569">derived_from 指向源 trajectory</text>
  <text x="916" y="676" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#9CA3AF">supersedes 替代旧经验</text>

  <!-- lineage arrow: trajectory -> experience (derived_from) -->
  <path d="M 992 440 L 992 560" stroke="#E8A838" stroke-width="1.5" stroke-dasharray="5,4" fill="none" marker-end="url(#arrO)"/>
  <text x="1000" y="505" font-family="Noto Sans SC, sans-serif" font-size="10" fill="#9A6B14">derived_from 血缘</text>

  <!-- 8. Consumption -->
  <rect x="1100" y="380" width="120" height="120" rx="8" fill="#FFFFFF" stroke="#7F8C8D" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="1100" y="380" width="120" height="34" rx="8" fill="#7F8C8D"/>
  <rect x="1100" y="406" width="120" height="8" fill="#7F8C8D"/>
  <text x="1160" y="402" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">后续消费</text>
  <text x="1112" y="432" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#475569">向量检索召回</text>
  <text x="1112" y="450" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#475569">上下文自动注入</text>
  <text x="1112" y="468" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#475569">Train 训练信号</text>

  <!-- arrows from stores to consumption -->
  <line x1="1082" y1="385" x2="1098" y2="420" stroke="#7F8C8D" stroke-width="1.5" marker-end="url(#arrGr)"/>
  <line x1="1082" y1="630" x2="1098" y2="470" stroke="#7F8C8D" stroke-width="1.5" marker-end="url(#arrGr)"/>
</svg>
