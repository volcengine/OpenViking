<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 520" width="680" height="520">
  <defs>
    <filter id="shadow2" x="-3%" y="-3%" width="106%" height="108%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000000" flood-opacity="0.1"/>
    </filter>
  </defs>

  <rect width="680" height="520" fill="#FAFBFC"/>

  <!-- 标题 -->
  <text x="340" y="35" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#1E293B">语义层级摘要架构</text>
  <text x="340" y="55" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#64748B">自底向上冒泡聚合，子节点变化触发父目录摘要刷新</text>

  <!-- ===== L2 最上层 ===== -->
  <g>
    <rect x="190" y="80" width="300" height="110" rx="14" fill="#FFFFFF" stroke="#FCD34D" stroke-width="1.5" filter="url(#shadow2)"/>
    <rect x="190" y="80" width="300" height="44" rx="14" fill="#F59E0B"/>
    <rect x="190" y="110" width="300" height="14" fill="#F59E0B"/>
    <circle cx="218" cy="102" r="13" fill="#FFFFFF" opacity="0.22"/>
    <text x="218" y="107" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">L2</text>
    <text x="240" y="100" font-family="Noto Sans SC, sans-serif" font-size="15" font-weight="700 fill="#FFFFFF">更上层目录</text>
    <text x="240" y="116" font-family="Noto Sans SC, sans-serif" font-size="10" fill="#FEF3C7">ROOT / 一级目录</text>

    <text x="210" y="148" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#475569">递归向上冒泡，父目录摘要</text>
    <text x="210" y="166" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#475569">聚合所有子目录摘要</text>
    <rect x="380" y="142" width="90" height="28" rx="6" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1"/>
    <text x="425" y="160" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#92400E">.abstract.md</text>
  </g>

  <!-- 箭头 L2 ← L1 -->
  <g>
    <line x1="340" y1="200" x2="340" y2="225" stroke="#94A3B8" stroke-width="2.5"/>
    <polygon points="332,225 348,225 340,239" fill="#94A3B8"/>
    <rect x="290" y="206" width="100" height="18" rx="4" fill="#F1F5F9"/>
    <text x="340" y="219" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="10" fill="#64748B">聚合冒泡</text>
  </g>

  <!-- ===== L1 目录级 ===== -->
  <g>
    <rect x="140" y="250" width="400" height="110" rx="14" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1.5" filter="url(#shadow2)"/>
    <rect x="140" y="250" width="400" height="44" rx="14" fill="#10B981"/>
    <rect x="140" y="280" width="400" height="14" fill="#10B981"/>
    <circle cx="168" cy="272" r="13" fill="#FFFFFF" opacity="0.22"/>
    <text x="168" y="277" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">L1</text>
    <text x="190" y="270" font-family="Noto Sans SC, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">目录级摘要</text>
    <text x="190" y="286" font-family="Noto Sans SC, sans-serif" font-size="10" fill="#D1FAE5">每个目录的 .abstract.md</text>

    <text x="160" y="318" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#475569">聚合子节点（文件 + 子目录）摘要</text>
    <text x="160" y="336" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#475569">子节点变化时标记为待刷新</text>
    <rect x="440" y="312" width="80" height="28" rx="6" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1"/>
    <text x="480" y="330" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#065F46">.abstract.md</text>
  </g>

  <!-- 箭头 L1 ← L0 -->
  <g>
    <line x1="340" y1="370" x2="340" y2="395" stroke="#94A3B8" stroke-width="2.5"/>
    <polygon points="332,395 348,395 340,409" fill="#94A3B8"/>
    <rect x="290" y="376" width="100" height="18" rx="4" fill="#F1F5F9"/>
    <text x="340" y="389" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="10" fill="#64748B">聚合冒泡</text>
  </g>

  <!-- ===== L0 文件级 ===== -->
  <g>
    <rect x="90" y="420" width="500" height="80" rx="14" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.5" filter="url(#shadow2)"/>
    <rect x="90" y="420" width="500" height="44" rx="14" fill="#3B82F6"/>
    <rect x="90" y="450" width="500" height="14" fill="#3B82F6"/>
    <circle cx="118" cy="442" r="13" fill="#FFFFFF" opacity="0.22"/>
    <text x="118" y="447" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">L0</text>
    <text x="140" y="440" font-family="Noto Sans SC, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">文件级摘要</text>
    <text x="140" y="456" font-family="Noto Sans SC, sans-serif" font-size="10" fill="#DBEAFE">每个文件的摘要</text>

    <text x="110" y="488" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#475569">存储在文件元数据中，文件内容变化时重新生成</text>
    <rect x="500" y="476" width="70" height="24" rx="6" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
    <text x="535" y="492" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="10" fill="#1E40AF">文件元数据</text>
  </g>

  <!-- 底部说明 -->
  <text x="340" y="515" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#94A3B8">freshness-aware bubbling：子节点变化只标记直接父目录为 pending，避免全量重算</text>
</svg>
