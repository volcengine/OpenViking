<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 820" width="1240" height="820">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000000" flood-opacity="0.1"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#94A3B8"/>
    </marker>
  </defs>

  <rect width="1240" height="820" fill="#FAFBFC"/>

  <text x="30" y="36" font-family="Noto Sans SC, sans-serif" font-size="18" font-weight="700" fill="#1F2937">viking://user/{uid}/ 目录架构总览</text>
  <text x="30" y="56" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#6B7280">用户私有数据根目录：会话记录 + 记忆资产 + 技能 / 对等 / 隐私 / 配置 / 私有资源</text>

  <!-- Root card -->
  <rect x="470" y="70" width="300" height="52" rx="8" fill="#2C3E50" filter="url(#shadow)"/>
  <text x="620" y="94" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">viking://user/{uid}/</text>
  <text x="620" y="112" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#CBD5E1">用户私有数据根（user scope）</text>

  <!-- bus -->
  <line x1="620" y1="122" x2="620" y2="140" stroke="#94A3B8" stroke-width="1.5"/>
  <line x1="210" y1="140" x2="1050" y2="140" stroke="#94A3B8" stroke-width="1.5"/>
  <line x1="210" y1="140" x2="210" y2="150" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="640" y1="140" x2="640" y2="150" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="1050" y1="140" x2="1050" y2="150" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ============ Column 1: sessions (blue) ============ -->
  <rect x="30" y="156" width="360" height="630" rx="8" fill="#FFFFFF" stroke="#ddd" stroke-width="1" filter="url(#shadow)"/>
  <rect x="30" y="156" width="360" height="44" rx="8" fill="#4A90D9"/>
  <rect x="30" y="192" width="360" height="8" fill="#4A90D9"/>
  <text x="46" y="184" font-family="Noto Sans SC, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">sessions/</text>
  <text x="374" y="184" text-anchor="end" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#DBEAFE">会话记录</text>

  <rect x="46" y="216" width="328" height="40" rx="4" fill="#EBF3FB" stroke="#C9DDF2"/>
  <text x="56" y="234" font-family="Noto Sans SC, sans-serif" font-size="12" font-weight="700" fill="#2C5E8A">messages.jsonl</text>
  <text x="56" y="249" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#475569">活跃消息，JSONL，实时追加</text>

  <rect x="46" y="266" width="328" height="34" rx="4" fill="#EBF3FB" stroke="#C9DDF2"/>
  <text x="56" y="287" font-family="Noto Sans SC, sans-serif" font-size="12" font-weight="700" fill="#2C5E8A">.meta.json</text>
  <text x="364" y="287" text-anchor="end" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#475569">SessionMeta 元数据</text>

  <rect x="46" y="310" width="328" height="300" rx="4" fill="#F4F8FD" stroke="#C9DDF2"/>
  <text x="56" y="330" font-family="Noto Sans SC, sans-serif" font-size="12" font-weight="700" fill="#2C5E8A">history/</text>
  <rect x="56" y="338" width="308" height="260" rx="4" fill="#FFFFFF" stroke="#C9DDF2"/>
  <text x="66" y="358" font-family="Noto Sans SC, sans-serif" font-size="12" font-weight="700" fill="#2C5E8A">archive_001/</text>
  <text x="76" y="380" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#475569">├─ messages.jsonl　归档原始消息</text>
  <text x="76" y="398" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#475569">├─ .meta.json　　 归档元数据</text>
  <text x="76" y="416" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#475569">├─ .overview.md　WM v2 摘要（7段）</text>
  <text x="76" y="434" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#475569">├─ .abstract.md　 摘要再提炼</text>
  <text x="76" y="452" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#475569">├─ .done　　　　 完成标记</text>
  <text x="76" y="470" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#475569">└─ .failed.json　失败标记（可选）</text>

  <rect x="46" y="620" width="328" height="150" rx="4" fill="#F4F8FD" stroke="#C9DDF2"/>
  <text x="56" y="640" font-family="Noto Sans SC, sans-serif" font-size="12" font-weight="700" fill="#2C5E8A">tool-results/</text>
  <text x="66" y="662" font-family="Noto Sans SC, sans-serif" font-size="12" font-weight="700" fill="#2C5E8A">tr_{tool_id}_{sha16}/</text>
  <text x="76" y="684" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#475569">├─ output.txt　外置大工具输出全文</text>
  <text x="76" y="702" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#475569">└─ metadata.json　元数据 + synopsis</text>
  <text x="56" y="740" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#64748B">归档只增不减，原始消息永不删除</text>
  <text x="56" y="758" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#64748B">无 TTL，按 turn_budget 选归档边界</text>

  <!-- ============ Column 2: memories (purple) ============ -->
  <rect x="430" y="156" width="420" height="630" rx="8" fill="#FFFFFF" stroke="#ddd" stroke-width="1" filter="url(#shadow)"/>
  <rect x="430" y="156" width="420" height="44" rx="8" fill="#9B59B6"/>
  <rect x="430" y="192" width="420" height="8" fill="#9B59B6"/>
  <text x="446" y="184" font-family="Noto Sans SC, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">memories/</text>
  <text x="834" y="184" text-anchor="end" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#EDE9FE">记忆资产（核心）</text>

  <!-- single files -->
  <rect x="446" y="216" width="388" height="56" rx="4" fill="#F6F0FA" stroke="#E3D4EE"/>
  <text x="456" y="236" font-family="Noto Sans SC, sans-serif" font-size="12" font-weight="700" fill="#6B3F8A">profile.md / identity.md / soul.md</text>
  <text x="456" y="254" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#475569">单文件 · upsert · patch 合并（用户画像 / Agent 身份 / 灵魂性格）</text>

  <rect x="446" y="282" width="188" height="50" rx="4" fill="#F6F0FA" stroke="#E3D4EE"/>
  <text x="456" y="302" font-family="Noto Sans SC, sans-serif" font-size="12" font-weight="700" fill="#6B3F8A">preferences/</text>
  <text x="456" y="318" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#475569">{user}/{topic}.md</text>

  <rect x="646" y="282" width="188" height="50" rx="4" fill="#F6F0FA" stroke="#E3D4EE"/>
  <text x="656" y="302" font-family="Noto Sans SC, sans-serif" font-size="12" font-weight="700" fill="#6B3F8A">entities/</text>
  <text x="656" y="318" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#475569">{category}/{name}.md</text>

  <rect x="446" y="342" width="388" height="46" rx="4" fill="#F6F0FA" stroke="#E3D4EE"/>
  <text x="456" y="362" font-family="Noto Sans SC, sans-serif" font-size="12" font-weight="700" fill="#6B3F8A">events/</text>
  <text x="456" y="378" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#475569">原子事件 {YYYY}/{MM}/{DD}/{name}.md · add_only</text>

  <!-- trajectories highlight green -->
  <rect x="446" y="398" width="388" height="60" rx="4" fill="#EAF7EE" stroke="#BFE6CB"/>
  <text x="456" y="418" font-family="Noto Sans SC, sans-serif" font-size="12" font-weight="700" fill="#2E7D46">trajectories/  ★</text>
  <text x="456" y="434" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#475569">{name}_{session_ts}.md · add_only（只追加）</text>
  <text x="456" y="450" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#475569">可复用操作契约（状态-动作边界），非原始步骤序列</text>

  <!-- experiences highlight orange -->
  <rect x="446" y="468" width="388" height="60" rx="4" fill="#FDF3E3" stroke="#F0D8A8"/>
  <text x="456" y="488" font-family="Noto Sans SC, sans-serif" font-size="12" font-weight="700" fill="#9A6B14">experiences/  ★</text>
  <text x="456" y="504" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#475569">{name}.md · upsert（同名更新）</text>
  <text x="456" y="520" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#475569">可复用经验：Situation / Approach / Reflect 三段式</text>

  <rect x="446" y="538" width="188" height="50" rx="4" fill="#F6F0FA" stroke="#E3D4EE"/>
  <text x="456" y="558" font-family="Noto Sans SC, sans-serif" font-size="12" font-weight="700" fill="#6B3F8A">cases/</text>
  <text x="456" y="574" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#475569">训练/评估用例</text>

  <rect x="646" y="538" width="188" height="50" rx="4" fill="#F1F2F4" stroke="#D7DBE0"/>
  <text x="656" y="558" font-family="Noto Sans SC, sans-serif" font-size="12" font-weight="700" fill="#6B7280">tools/ · skills/</text>
  <text x="656" y="574" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#9CA3AF">使用统计（默认 disabled）</text>

  <rect x="446" y="598" width="388" height="170" rx="4" fill="#FAF8FC" stroke="#E3D4EE"/>
  <text x="456" y="618" font-family="Noto Sans SC, sans-serif" font-size="12" font-weight="700" fill="#6B3F8A">记忆合并策略</text>
  <text x="456" y="640" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#475569">PATCH 　content（profile / preferences / entities）块级 SEARCH/REPLACE/DELETE</text>
  <text x="456" y="660" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#475569">REPLACE content（experiences）全量重写</text>
  <text x="456" y="680" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#475569">SUM 　 call_count / success_count 等数值累加</text>
  <text x="456" y="700" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#475569">IMMUTABLE experience_name / trajectory_name 只设一次</text>
  <text x="456" y="726" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#64748B">★ = session → trajectory → experience 两阶段提取核心产物</text>

  <!-- ============ Column 3: other dirs (gray) ============ -->
  <rect x="890" y="156" width="320" height="630" rx="8" fill="#FFFFFF" stroke="#ddd" stroke-width="1" filter="url(#shadow)"/>
  <rect x="890" y="156" width="320" height="44" rx="8" fill="#7F8C8D"/>
  <rect x="890" y="192" width="320" height="8" fill="#7F8C8D"/>
  <text x="906" y="184" font-family="Noto Sans SC, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">其他 user 子目录</text>

  <rect x="906" y="216" width="288" height="92" rx="4" fill="#F1F2F4" stroke="#D7DBE0"/>
  <text x="916" y="236" font-family="Noto Sans SC, sans-serif" font-size="12" font-weight="700" fill="#4B5563">skills/</text>
  <text x="916" y="254" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#475569">{skill_name}/SKILL.md</text>
  <text x="916" y="272" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#475569">用户显式要求记住的可复用技能</text>
  <text x="916" y="290" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#9CA3AF">（区别于 memories/skills/ 的统计）</text>

  <rect x="906" y="318" width="288" height="92" rx="4" fill="#F1F2F4" stroke="#D7DBE0"/>
  <text x="916" y="338" font-family="Noto Sans SC, sans-serif" font-size="12" font-weight="700" fill="#4B5563">peers/</text>
  <text x="916" y="356" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#475569">{peer_id}/memories/ + resources/</text>
  <text x="916" y="374" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#475569">对等 Agent 数据隔离</text>
  <text x="916" y="392" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#9CA3AF">MemoryIsolationHandler 路由</text>

  <rect x="906" y="420" width="288" height="100" rx="4" fill="#F1F2F4" stroke="#D7DBE0"/>
  <text x="916" y="440" font-family="Noto Sans SC, sans-serif" font-size="12" font-weight="700" fill="#4B5563">privacy/</text>
  <text x="916" y="458" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#475569">{category}/{target_key}/</text>
  <text x="916" y="476" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#475569">current.json + .meta.json</text>
  <text x="916" y="494" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#475569">history/version_*.json 版本管理回滚</text>
  <text x="916" y="512" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#9CA3AF">过滤规则影响记忆提取</text>

  <rect x="906" y="530" width="288" height="80" rx="4" fill="#F1F2F4" stroke="#D7DBE0"/>
  <text x="916" y="550" font-family="Noto Sans SC, sans-serif" font-size="12" font-weight="700" fill="#4B5563">settings/</text>
  <text x="916" y="568" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#475569">user_config.json</text>
  <text x="916" y="586" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#475569">add_targets · memory_policy</text>

  <rect x="906" y="620" width="288" height="92" rx="4" fill="#F1F2F4" stroke="#D7DBE0"/>
  <text x="916" y="640" font-family="Noto Sans SC, sans-serif" font-size="12" font-weight="700" fill="#4B5563">resources/</text>
  <text x="916" y="658" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#475569">用户私有资源</text>
  <text x="916" y="676" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#475569">默认检索范围含</text>
  <text x="916" y="694" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#9CA3AF">viking://resources + user_root</text>
</svg>
