    <text x="708" y="152" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#475569">POST /api/v1/search/search</text>
    <text x="708" y="166" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#475569">VikingDB 相似度搜索</text>

    <rect x="696" y="180" width="238" height="46" rx="8" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1"/>
    <text x="708" y="200" font-family="Noto Sans SC, sans-serif" font-size="12" font-weight="700" fill="#065F46">上下文组装</text>
    <text x="708" y="216" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#475569">自动注入对话上下文</text>

    <rect x="696" y="236" width="238" height="46" rx="8" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1"/>
    <text x="708" y="256" font-family="Noto Sans SC, sans-serif" font-size="12" font-weight="700" fill="#065F46">文件级访问</text>
    <text x="708" y="272" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#475569">read / tree / WebDAV</text>

    <rect x="696" y="292" width="238" height="46" rx="8" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1"/>
    <text x="708" y="312" font-family="Noto Sans SC, sans-serif" font-size="12" font-weight="700" fill="#065F46">Watch 自动刷新</text>
    <text x="708" y="328" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#475569">定时重新拉取源并覆盖</text>

    <rect x="696" y="348" width="238" height="46" rx="8" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1"/>
    <text x="708" y="368" font-family="Noto Sans SC, sans-serif" font-size="12" font-weight="700" fill="#065F46">MCP 工具</text>
    <text x="708" y="384" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#475569">Agent 直接读写检索</text>

    <text x="815" y="412" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#64748B">全局共享 · 所有用户默认可见</text>
  </g>

  <!-- 箭头3 -->
  <g>
    <line x1="960" y1="255" x2="986" y2="255" stroke="#94A3B8" stroke-width="2"/>
    <polygon points="986,248 1000,255 986,262" fill="#94A3B8"/>
    <rect x="970" y="236" width="30" height="16" rx="4" fill="#F1F5F9"/>
    <text x="985" y="248" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="10" fill="#64748B">变更</text>
  </g>

  <!-- ==================== 卡片4：维护删除 ==================== -->
