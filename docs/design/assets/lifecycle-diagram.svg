  <g>
    <rect x="680" y="40" width="270" height="430" rx="14" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="680" y="40" width="270" height="56" rx="14" fill="#10B981"/>
    <rect x="680" y="82" width="270" height="14" fill="#10B981"/>
    <circle cx="708" cy="68" r="15" fill="#FFFFFF" opacity="0.22"/>
    <text x="708" y="73" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">3</text>
    <text x="734" y="64" font-family="Noto Sans SC, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">消费</text>
    <text x="734" y="84" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#D1FAE5" letter-spacing="1">CONSUMPTION</text>
    <rect x="868" y="58" width="68" height="20" rx="10" fill="#FFFFFF" opacity="0.18"/>
