    <rect x="1010" y="40" width="270" height="430" rx="14" fill="#FFFFFF" stroke="#FCD34D" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="1010" y="40" width="270" height="56" rx="14" fill="#F59E0B"/>
    <rect x="1010" y="82" width="270" height="14" fill="#F59E0B"/>
