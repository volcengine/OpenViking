    <text x="1038" y="73" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">4</text>
    <text x="1064" y="64" font-family="Noto Sans SC, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">维护删除</text>
    <text x="1064" y="84" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#FEF3C7" letter-spacing="1">MAINTENANCE</text>
    <rect x="1198" y="58" width="68" height="20" rx="10" fill="#FFFFFF" opacity="0.18"/>
    <text x="1232" y="72" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="10" fill="#FFFFFF">自动级联</text>

    <rect x="1026" y="112" width="238" height="58" rx="8" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1"/>
    <text x="1038" y="134" font-family="Noto Sans SC, sans-serif" font-size="12" font-weight="700" fill="#92400E">更新 / 覆盖</text>
    <text x="1038" y="152" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#475569">write / edit / reimport</text>
    <text x="1038" y="166" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#475569">Watch 定时刷新覆盖</text>

    <rect x="1026" y="180" width="238" height="46" rx="8" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1"/>
    <text x="1038" y="200" font-family="Noto Sans SC, sans-serif" font-size="12" font-weight="700" fill="#92400E">删除清理</text>
    <text x="1038" y="216" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#475569">rm / recursive 删除</text>

    <rect x="1026" y="236" width="238" height="46" rx="8" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1"/>
    <text x="1038" y="256" font-family="Noto Sans SC, sans-serif" font-size="12" font-weight="700" fill="#92400E">索引同步</text>
    <text x="1038" y="272" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#475569">语义刷新 + 向量删除</text>

    <rect x="1026" y="292" width="238" height="46" rx="8" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1"/>
    <text x="1038" y="312" font-family="Noto Sans SC, sans-serif" font-size="12" font-weight="700" fill="#92400E">Watch 联动停用</text>
    <text x="1038" y="328" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#475569">目标被删自动停用监控</text>

    <rect x="1026" y="348" width="238" height="46" rx="8" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1"/>
    <text x="1038" y="368" font-family="Noto Sans SC, sans-serif" font-size="12" font-weight="700" fill="#92400E">记忆链接清理</text>
    <text x="1038" y="384" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#475569">防止悬空引用</text>

    <text x="1145" y="412" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#64748B">删除联动 · 自动级联处理</text>
  </g>

  <!-- 底部闭环虚线 -->
  <g>
    <path d="M 1145 485 Q 1145 510 1110 510 L 155 510 Q 120 510 120 485" fill="none" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="6,4"/>
    <polygon points="120,485 113,495 127,495" fill="#CBD5E1"/>
    <text x="620" y="503" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#94A3B8">删除后可重新写入 · 形成生命周期闭环</text>
  </g>
</svg>
