<text x="438.5" y="571.5" font-size="14" font-weight="700" fill="#646A73" text-anchor="middle">While sealing is in effect, registered and</text>
<text x="438.5" y="590.5" font-size="14" font-weight="700" fill="#646A73" text-anchor="middle">recognised secrets cross here only as references</text>
<rect x="196" y="112" width="300" height="128" rx="10" fill="#FFFFFF" stroke="#3370FF" stroke-width="1.8"/>
<text x="214" y="144" font-size="16" font-weight="700" fill="#1F2329" text-anchor="start">You paste a new token</text>
