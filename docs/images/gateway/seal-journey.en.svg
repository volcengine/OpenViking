<text x="214" y="652" font-size="16" font-weight="700" fill="#1F2329" text-anchor="start">The model gets the</text>
<text x="214" y="673" font-size="16" font-weight="700" fill="#1F2329" text-anchor="start">reference and a note</text>
<circle cx="198" cy="622" r="13" fill="#7F3BF5" stroke="none" stroke-width="0"/>
<text x="198" y="627.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="214" y="699" font-size="14.5" font-weight="400" fill="#1F2329" text-anchor="start">“…new GitHub token</text>
<rect x="214" y="711.5" width="134" height="24" rx="12" fill="#E3F6F5" stroke="#14A8A0" stroke-width="1.5"/>
<text x="281" y="729" font-size="14" font-weight="700" fill="#0B7E78" text-anchor="middle">{{ov_privacy:…}}</text>
<text x="354" y="729" font-size="14.5" font-weight="400" fill="#1F2329" text-anchor="start">, use it…”</text>
<text x="214" y="757" font-size="14.5" font-weight="400" fill="#646A73" text-anchor="start">Note: save it under a proper name</text>
<rect x="516" y="620" width="274" height="196" rx="10" fill="#FFFFFF" stroke="#FF8800" stroke-width="1.8"/>
<text x="534" y="652" font-size="16" font-weight="700" fill="#1F2329" text-anchor="start">The model saves it</text>
<circle cx="518" cy="622" r="13" fill="#7F3BF5" stroke="none" stroke-width="0"/>
<text x="518" y="627.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="534" y="678" font-size="14.5" font-weight="400" fill="#1F2329" text-anchor="start">privacy_upsert, value =</text>
<rect x="534" y="690.5" width="134" height="24" rx="12" fill="#E3F6F5" stroke="#14A8A0" stroke-width="1.5"/>
<text x="601" y="708" font-size="14" font-weight="700" fill="#0B7E78" text-anchor="middle">{{ov_privacy:…}}</text>
<text x="534" y="734" font-size="14.5" font-weight="400" fill="#1F2329" text-anchor="start">→ credential/github</text>
<text x="534" y="758" font-size="14.5" font-weight="400" fill="#646A73" text-anchor="start">The reference goes to</text>
<text x="534" y="780" font-size="14.5" font-weight="400" fill="#646A73" text-anchor="start">OpenViking as it is; OpenViking</text>
<text x="534" y="802" font-size="14.5" font-weight="400" fill="#646A73" text-anchor="start">stores the value behind it</text>
<rect x="810" y="620" width="270" height="128" rx="10" fill="#FFFFFF" stroke="#FF8800" stroke-width="1.8"/>
<text x="828" y="652" font-size="16" font-weight="700" fill="#1F2329" text-anchor="start">The model writes a tool</text>
<text x="828" y="673" font-size="16" font-weight="700" fill="#1F2329" text-anchor="start">call with the reference</text>
<circle cx="812" cy="622" r="13" fill="#7F3BF5" stroke="none" stroke-width="0"/>
<text x="812" y="627.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<text x="828" y="699" font-size="14.5" font-weight="400" fill="#1F2329" text-anchor="start">curl … Bearer</text>
<rect x="828" y="711.5" width="134" height="24" rx="12" fill="#E3F6F5" stroke="#14A8A0" stroke-width="1.5"/>
<text x="895" y="729" font-size="14" font-weight="700" fill="#0B7E78" text-anchor="middle">{{ov_privacy:…}}</text>
<rect x="1100" y="620" width="344" height="128" rx="10" fill="#FFFFFF" stroke="#FF8800" stroke-width="1.8"/>
<text x="1118" y="652" font-size="16" font-weight="700" fill="#1F2329" text-anchor="start">The model reads the output</text>
<text x="1118" y="682" font-size="14.5" font-weight="400" fill="#1F2329" text-anchor="start">Output: …</text>
<rect x="1194.61" y="664.5" width="134" height="24" rx="12" fill="#E3F6F5" stroke="#14A8A0" stroke-width="1.5"/>
<text x="1261.61" y="682" font-size="14" font-weight="700" fill="#0B7E78" text-anchor="middle">{{ov_privacy:…}}</text>
<text x="1334.61" y="682" font-size="14.5" font-weight="400" fill="#1F2329" text-anchor="start">…</text>
<text x="1118" y="710" font-size="14.5" font-weight="400" fill="#646A73" text-anchor="start">The reference the model already uses</text>
