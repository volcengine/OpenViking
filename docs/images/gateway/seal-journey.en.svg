<text x="320" y="200" font-size="14.5" font-weight="400" fill="#1F2329" text-anchor="start">, use it from now on”</text>
<rect x="880" y="112" width="360" height="128" rx="10" fill="#FFFFFF" stroke="#3370FF" stroke-width="1.8"/>
<text x="898" y="144" font-size="16" font-weight="700" fill="#1F2329" text-anchor="start">Your tool runs</text>
<text x="898" y="174" font-size="14.5" font-weight="400" fill="#1F2329" text-anchor="start">curl … Bearer</text>
<rect x="998.98" y="156.5" width="100" height="24" rx="12" fill="#FDECEC" stroke="#F54A45" stroke-width="1.5"/>
<text x="1048.98" y="174" font-size="14" font-weight="700" fill="#D83931" text-anchor="middle">ghp_Ab12…</text>
<text x="898" y="206" font-size="14.5" font-weight="400" fill="#1F2329" text-anchor="start">Output: …</text>
<rect x="974.61" y="188.5" width="100" height="24" rx="12" fill="#FDECEC" stroke="#F54A45" stroke-width="1.5"/>
<text x="1024.61" y="206" font-size="14" font-weight="700" fill="#D83931" text-anchor="middle">ghp_Ab12…</text>
<text x="1080.61" y="206" font-size="14.5" font-weight="400" fill="#1F2329" text-anchor="start">…</text>
<rect x="196" y="272" width="300" height="96" rx="10" fill="#FFFFFF" stroke="#7F3BF5" stroke-width="1.8"/>
<text x="214" y="304" font-size="16" font-weight="700" fill="#1F2329" text-anchor="start">Stored and replaced</text>
<circle cx="198" cy="274" r="13" fill="#7F3BF5" stroke="none" stroke-width="0"/>
<text x="198" y="279.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="214" y="328" font-size="14.5" font-weight="400" fill="#646A73" text-anchor="start">Sends the text to OpenViking,</text>
<text x="214" y="350" font-size="14.5" font-weight="400" fill="#646A73" text-anchor="start">which stores the new token</text>
<rect x="600" y="272" width="440" height="96" rx="10" fill="#FFFFFF" stroke="#7F3BF5" stroke-width="1.8"/>
<text x="618" y="304" font-size="16" font-weight="700" fill="#1F2329" text-anchor="start">The tool runs with the real value</text>
<circle cx="602" cy="274" r="13" fill="#7F3BF5" stroke="none" stroke-width="0"/>
<text x="602" y="279.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text>
<text x="618" y="328" font-size="14.5" font-weight="400" fill="#646A73" text-anchor="start">Gets the value for the reference from</text>
<text x="618" y="350" font-size="14.5" font-weight="400" fill="#646A73" text-anchor="start">OpenViking and hands it to your tool</text>
<rect x="1080" y="272" width="364" height="96" rx="10" fill="#FFFFFF" stroke="#7F3BF5" stroke-width="1.8"/>
<text x="1098" y="304" font-size="16" font-weight="700" fill="#1F2329" text-anchor="start">Output is sealed again</text>
<circle cx="1082" cy="274" r="13" fill="#7F3BF5" stroke="none" stroke-width="0"/>
<text x="1082" y="279.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">7</text>
<text x="1098" y="328" font-size="14.5" font-weight="400" fill="#646A73" text-anchor="start">The token is stored now, so the</text>
<text x="1098" y="350" font-size="14.5" font-weight="400" fill="#646A73" text-anchor="start">output reaches the model as a reference</text>
<rect x="260" y="428" width="236" height="108" rx="10" fill="#FFFFFF" stroke="#6425D0" stroke-width="1.8" stroke-dasharray="6 4"/>
<text x="278" y="460" font-size="16" font-weight="700" fill="#1F2329" text-anchor="start">Temporary entry</text>
<text x="278" y="484" font-size="14.5" font-weight="400" fill="#646A73" text-anchor="start">auto/github-k3j2m8</text>
<rect x="278" y="496.5" width="100" height="24" rx="12" fill="#FDECEC" stroke="#F54A45" stroke-width="1.5"/>
<text x="328" y="514" font-size="14" font-weight="700" fill="#D83931" text-anchor="middle">ghp_Ab12…</text>
<rect x="650" y="428" width="300" height="108" rx="10" fill="#FFFFFF" stroke="#6425D0" stroke-width="1.8"/>
<text x="668" y="460" font-size="16" font-weight="700" fill="#1F2329" text-anchor="start">Saved entry</text>
<text x="668" y="484" font-size="14.5" font-weight="400" fill="#646A73" text-anchor="start">credential/github · token</text>
<rect x="668" y="496.5" width="100" height="24" rx="12" fill="#FDECEC" stroke="#F54A45" stroke-width="1.5"/>
<text x="718" y="514" font-size="14" font-weight="700" fill="#D83931" text-anchor="middle">ghp_Ab12…</text>
