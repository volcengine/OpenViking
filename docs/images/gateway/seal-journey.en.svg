<text x="330" y="388" font-size="14" font-weight="400" fill="#D83931" text-anchor="start">your text</text>
<text x="450" y="388" font-size="14" font-weight="400" fill="#0B7E78" text-anchor="start">text with reference</text>
<polygon points="232,620 226.5,610 237.5,610" fill="#14A8A0"/>
<path d="M 232 368 L 232 610" fill="none" stroke="#14A8A0" stroke-width="2" stroke-linejoin="round"/>
<polygon points="700,536 705.5,546 694.5,546" fill="#14A8A0"/>
<path d="M 700 620 L 700 546" fill="none" stroke="#14A8A0" stroke-width="2" stroke-linejoin="round"/>
<rect x="706" y="555" width="198.52" height="42" rx="4" fill="#FFFFFF" stroke="none" stroke-width="0"/>
<text x="710" y="571.5" font-size="14" font-weight="400" fill="#0B7E78" text-anchor="start">privacy_upsert tool call,</text>
<text x="710" y="590.5" font-size="14" font-weight="400" fill="#0B7E78" text-anchor="start">passed through unchanged</text>
<polygon points="650,482 640,487.5 640,476.5" fill="#F54A45"/>
<path d="M 496 482 L 640 482" fill="none" stroke="#F54A45" stroke-width="2" stroke-linejoin="round"/>
<text x="573" y="472" font-size="14" font-weight="400" fill="#646A73" text-anchor="middle">value moved</text>
<text x="573" y="505" font-size="14" font-weight="400" fill="#646A73" text-anchor="middle">temporary entry</text>
<text x="573" y="524" font-size="14" font-weight="400" fill="#646A73" text-anchor="middle">removed</text>
<polygon points="1000,368 1005.5,378 994.5,378" fill="#14A8A0"/>
<path d="M 1000 620 L 1000 378" fill="none" stroke="#14A8A0" stroke-width="2" stroke-linejoin="round"/>
<polygon points="760,428 754.5,418 765.5,418" fill="#14A8A0"/>
<path d="M 760 368 L 760 418" fill="none" stroke="#14A8A0" stroke-width="2" stroke-linejoin="round"/>
<polygon points="840,368 845.5,378 834.5,378" fill="#F54A45"/>
<path d="M 840 428 L 840 378" fill="none" stroke="#F54A45" stroke-width="2" stroke-linejoin="round"/>
<text x="750" y="388" font-size="14" font-weight="400" fill="#0B7E78" text-anchor="end">reference</text>
<text x="850" y="388" font-size="14" font-weight="400" fill="#D83931" text-anchor="start">real value</text>
<polygon points="960,240 965.5,250 954.5,250" fill="#F54A45"/>
<path d="M 960 272 L 960 250" fill="none" stroke="#F54A45" stroke-width="2" stroke-linejoin="round"/>
<polygon points="1180,272 1174.5,262 1185.5,262" fill="#F54A45"/>
<path d="M 1180 240 L 1180 262" fill="none" stroke="#F54A45" stroke-width="2" stroke-linejoin="round"/>
<polygon points="1300,620 1294.5,610 1305.5,610" fill="#14A8A0"/>
<path d="M 1300 368 L 1300 610" fill="none" stroke="#14A8A0" stroke-width="2" stroke-linejoin="round"/>
<text x="40" y="880" font-size="18" font-weight="700" fill="#1F2329" text-anchor="start">What a reference looks like</text>
<text x="760" y="880" font-size="18" font-weight="700" fill="#1F2329" text-anchor="start">Limits</text>
<rect x="40" y="896" width="700" height="174" rx="12" fill="#E3F6F5" stroke="#14A8A0" stroke-width="1.5"/>
<text x="62" y="930" font-size="14.5" font-weight="700" fill="#0B7E78" text-anchor="start">{{ov_privacy:alice:viking://~/privacy/credential/github#/values/token}}</text>
<text x="62" y="960" font-size="14.5" font-weight="400" fill="#1F2329" text-anchor="start">Owner, entry and field. It is not the secret itself: it is bound to its owner,</text>
<text x="62" y="984" font-size="14.5" font-weight="400" fill="#1F2329" text-anchor="start">and only alice’s OpenViking identity can resolve it.</text>
<rect x="760" y="896" width="700" height="174" rx="12" fill="#F5F6F7" stroke="#8F959E" stroke-width="1.5"/>
<text x="782" y="930" font-size="14.5" font-weight="400" fill="#1F2329" text-anchor="start">A new token is stored only if OpenViking’s detector recognises it.</text>
<text x="782" y="954" font-size="14.5" font-weight="400" fill="#1F2329" text-anchor="start">Only whole values are matched; a cut or re-encoded value goes out as it is.</text>
<text x="782" y="978" font-size="14.5" font-weight="400" fill="#1F2329" text-anchor="start">A new token seen only in tool output is stored only with the extra option</text>
<text x="782" y="1002" font-size="14.5" font-weight="400" fill="#1F2329" text-anchor="start">“Also store secrets found in tool output”.</text>
<text x="782" y="1026" font-size="14.5" font-weight="400" fill="#1F2329" text-anchor="start">Step 7 seals this output because the token is already stored.</text>
<text x="782" y="1050" font-size="14.5" font-weight="400" fill="#1F2329" text-anchor="start">When sealing cannot be done, the request is refused, never sent unsealed.</text>
<polygon points="70,1107 60,1112.5 60,1101.5" fill="#F54A45"/>
<path d="M 40 1107 L 60 1107" fill="none" stroke="#F54A45" stroke-width="2" stroke-linejoin="round"/>
<rect x="78" y="1094.5" width="100" height="24" rx="12" fill="#FDECEC" stroke="#F54A45" stroke-width="1.5"/>
<text x="128" y="1112" font-size="14" font-weight="700" fill="#D83931" text-anchor="middle">ghp_Ab12…</text>
<text x="188" y="1112" font-size="14.5" font-weight="400" fill="#646A73" text-anchor="start">Real value</text>
<polygon points="321.12,1107 311.12,1112.5 311.12,1101.5" fill="#14A8A0"/>
<path d="M 291.12 1107 L 311.12 1107" fill="none" stroke="#14A8A0" stroke-width="2" stroke-linejoin="round"/>
<rect x="329.12" y="1094.5" width="134" height="24" rx="12" fill="#E3F6F5" stroke="#14A8A0" stroke-width="1.5"/>
<text x="396.12" y="1112" font-size="14" font-weight="700" fill="#0B7E78" text-anchor="middle">{{ov_privacy:…}}</text>
<text x="473.12" y="1112" font-size="14.5" font-weight="400" fill="#646A73" text-anchor="start">Reference</text>
<circle cx="588.2" cy="1107" r="12" fill="#7F3BF5" stroke="none" stroke-width="0"/>
<text x="588.2" y="1112" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="610.2" y="1112" font-size="14.5" font-weight="400" fill="#646A73" text-anchor="start">Step order</text>
</svg>
