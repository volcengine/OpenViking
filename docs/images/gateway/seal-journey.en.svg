<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1142" viewBox="0 0 1500 1142" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans SC', 'Noto Sans CJK SC', sans-serif">
<rect x="0" y="0" width="1500" height="1142" rx="20" fill="#FFFFFF"/>
<text x="40" y="46" font-size="26" font-weight="700" fill="#1F2329" text-anchor="start">One new token through one turn: the provider sees a reference, your tool gets the value</text>
<text x="40" y="75" font-size="15" font-weight="400" fill="#646A73" text-anchor="start">The sealing layer is the OpenViking Gateway; it uses OpenViking’s seal endpoint and detection rules</text>
<rect x="40" y="96" width="1420" height="160" rx="0" fill="#F5F9FF" stroke="none" stroke-width="0"/>
<text x="105" y="148" font-size="17" font-weight="700" fill="#3370FF" text-anchor="middle">You and</text>
<text x="105" y="170" font-size="17" font-weight="700" fill="#3370FF" text-anchor="middle">your tools</text>
<text x="105" y="196" font-size="14" font-weight="400" fill="#646A73" text-anchor="middle">Work with the</text>
<text x="105" y="215" font-size="14" font-weight="400" fill="#646A73" text-anchor="middle">real value</text>
<rect x="40" y="256" width="1420" height="144" rx="0" fill="#F7F3FF" stroke="none" stroke-width="0"/>
<text x="105" y="302" font-size="17" font-weight="700" fill="#7F3BF5" text-anchor="middle">Sealing</text>
<text x="105" y="324" font-size="17" font-weight="700" fill="#7F3BF5" text-anchor="middle">layer</text>
<text x="105" y="350" font-size="14" font-weight="400" fill="#646A73" text-anchor="middle">OpenViking</text>
<text x="105" y="369" font-size="14" font-weight="400" fill="#646A73" text-anchor="middle">Gateway</text>
<rect x="40" y="400" width="1420" height="176" rx="0" fill="#F1EBFF" stroke="none" stroke-width="0"/>
<text x="105" y="452" font-size="17" font-weight="700" fill="#6425D0" text-anchor="middle">OpenViking</text>
<text x="105" y="478" font-size="14" font-weight="400" fill="#646A73" text-anchor="middle">Privacy vault,</text>
<text x="105" y="497" font-size="14" font-weight="400" fill="#646A73" text-anchor="middle">per user;</text>
<text x="105" y="516" font-size="14" font-weight="400" fill="#646A73" text-anchor="middle">detection rules</text>
<text x="105" y="535" font-size="14" font-weight="400" fill="#646A73" text-anchor="middle">live here</text>
<rect x="40" y="576" width="1420" height="260" rx="0" fill="#FFF8F0" stroke="none" stroke-width="0"/>
<text x="105" y="687.5" font-size="17" font-weight="700" fill="#FF8800" text-anchor="middle">Model</text>
<text x="105" y="709.5" font-size="17" font-weight="700" fill="#FF8800" text-anchor="middle">provider</text>
<text x="105" y="735.5" font-size="14" font-weight="400" fill="#646A73" text-anchor="middle">Sees references</text>
<rect x="40" y="96" width="1420" height="740" rx="0" fill="none" stroke="#E5E6EB" stroke-width="1"/>
