<text x="518" y="627.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="534" y="678" font-size="14.5" font-weight="400" fill="#1F2329" text-anchor="start">privacy_upsert，值 =</text>
<rect x="534" y="690.5" width="134" height="24" rx="12" fill="#E3F6F5" stroke="#14A8A0" stroke-width="1.5"/>
<text x="601" y="708" font-size="14" font-weight="700" fill="#0B7E78" text-anchor="middle">{{ov_privacy:…}}</text>
