<text x="1118" y="682" font-size="14.5" font-weight="400" fill="#1F2329" text-anchor="start">输出：…</text>
<rect x="1182.17" y="664.5" width="134" height="24" rx="12" fill="#E3F6F5" stroke="#14A8A0" stroke-width="1.5"/>
<text x="1249.17" y="682" font-size="14" font-weight="700" fill="#0B7E78" text-anchor="middle">{{ov_privacy:…}}</text>
<text x="1322.17" y="682" font-size="14.5" font-weight="400" fill="#1F2329" text-anchor="start">…</text>
<text x="1118" y="710" font-size="14.5" font-weight="400" fill="#646A73" text-anchor="start">和模型已经在用的引用相同</text>
