<text x="40" y="880" font-size="18" font-weight="700" fill="#1F2329" text-anchor="start">引用长什么样</text>
<text x="760" y="880" font-size="18" font-weight="700" fill="#1F2329" text-anchor="start">边界</text>
<rect x="40" y="896" width="700" height="174" rx="12" fill="#E3F6F5" stroke="#14A8A0" stroke-width="1.5"/>
<text x="62" y="930" font-size="14.5" font-weight="700" fill="#0B7E78" text-anchor="start">{{ov_privacy:alice:viking://~/privacy/credential/github#/values/token}}</text>
<text x="62" y="960" font-size="14.5" font-weight="400" fill="#1F2329" text-anchor="start">写明归属、条目和字段。它本身不是密钥：引用绑定所有者，</text>
<text x="62" y="984" font-size="14.5" font-weight="400" fill="#1F2329" text-anchor="start">只有 alice 的 OpenViking 身份能换回真值。</text>
<rect x="760" y="896" width="700" height="174" rx="12" fill="#F5F6F7" stroke="#8F959E" stroke-width="1.5"/>
<text x="782" y="930" font-size="14.5" font-weight="400" fill="#1F2329" text-anchor="start">新 token 只有 OpenViking 的探测器认得才登记。</text>
<text x="782" y="954" font-size="14.5" font-weight="400" fill="#1F2329" text-anchor="start">只认完整的值；被截断或改写的值会原样发出。</text>
<text x="782" y="978" font-size="14.5" font-weight="400" fill="#1F2329" text-anchor="start">只出现在工具输出里的新 token，只有打开额外选项才登记</text>
<text x="782" y="1002" font-size="14.5" font-weight="400" fill="#1F2329" text-anchor="start">「同时登记工具输出中的密钥」。</text>
<text x="782" y="1026" font-size="14.5" font-weight="400" fill="#1F2329" text-anchor="start">第 7 步能封存这段输出，是因为这个 token 已经存过。</text>
<text x="782" y="1050" font-size="14.5" font-weight="400" fill="#1F2329" text-anchor="start">无法封存时请求会被拒绝，不会未经封存发出。</text>
<polygon points="70,1107 60,1112.5 60,1101.5" fill="#F54A45"/>
