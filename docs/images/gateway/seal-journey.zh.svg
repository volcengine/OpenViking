<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1142" viewBox="0 0 1500 1142" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans SC', 'Noto Sans CJK SC', sans-serif">
<rect x="0" y="0" width="1500" height="1142" rx="20" fill="#FFFFFF"/>
<text x="40" y="46" font-size="26" font-weight="700" fill="#1F2329" text-anchor="start">一个新 token 走完一轮：模型厂商看到引用，工具拿到真值</text>
<text x="40" y="75" font-size="15" font-weight="400" fill="#646A73" text-anchor="start">封存层是 OpenViking 网关，它调用 OpenViking 的封存接口和识别规则</text>
