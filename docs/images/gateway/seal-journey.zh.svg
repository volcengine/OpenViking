<text x="618" y="328" font-size="14.5" font-weight="400" fill="#646A73" text-anchor="start">向 OpenViking 换回引用对应的真值，</text>
<text x="618" y="350" font-size="14.5" font-weight="400" fill="#646A73" text-anchor="start">再交给你的工具</text>
<rect x="1080" y="272" width="364" height="96" rx="10" fill="#FFFFFF" stroke="#7F3BF5" stroke-width="1.8"/>
