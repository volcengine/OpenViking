<text x="534" y="758" font-size="14.5" font-weight="400" fill="#646A73" text-anchor="start">引用原样交给 OpenViking，</text>
<text x="534" y="780" font-size="14.5" font-weight="400" fill="#646A73" text-anchor="start">由服务端取值保存</text>
<rect x="810" y="620" width="270" height="128" rx="10" fill="#FFFFFF" stroke="#FF8800" stroke-width="1.8"/>
<text x="828" y="652" font-size="16" font-weight="700" fill="#1F2329" text-anchor="start">模型在工具调用里写引用</text>
<circle cx="812" cy="622" r="13" fill="#7F3BF5" stroke="none" stroke-width="0"/>
<text x="812" y="627.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<text x="828" y="678" font-size="14.5" font-weight="400" fill="#1F2329" text-anchor="start">curl … Bearer</text>
<rect x="828" y="690.5" width="134" height="24" rx="12" fill="#E3F6F5" stroke="#14A8A0" stroke-width="1.5"/>
<text x="895" y="708" font-size="14" font-weight="700" fill="#0B7E78" text-anchor="middle">{{ov_privacy:…}}</text>
<rect x="1100" y="620" width="344" height="128" rx="10" fill="#FFFFFF" stroke="#FF8800" stroke-width="1.8"/>
