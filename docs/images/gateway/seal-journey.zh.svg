<text x="348" y="708" font-size="14.5" font-weight="400" fill="#1F2329" text-anchor="start">，以后用它…”</text>
<text x="214" y="736" font-size="14.5" font-weight="400" fill="#646A73" text-anchor="start">说明：存到正式名字下</text>
<rect x="516" y="620" width="274" height="196" rx="10" fill="#FFFFFF" stroke="#FF8800" stroke-width="1.8"/>
<text x="534" y="652" font-size="16" font-weight="700" fill="#1F2329" text-anchor="start">模型把它存好</text>
