<rect x="618.5" y="904" width="159.5" height="72" rx="8" fill="#FFFFFF" stroke="#7F3BF5" stroke-width="1.5"/>
<text x="698.25" y="925.5" font-size="14" font-weight="400" fill="#1F2329" text-anchor="middle">提交会话，</text>
<text x="698.25" y="944.5" font-size="14" font-weight="400" fill="#1F2329" text-anchor="middle">OpenViking</text>
<text x="698.25" y="963.5" font-size="14" font-weight="400" fill="#1F2329" text-anchor="middle">提取记忆</text>
<text x="62" y="1000" font-size="14" font-weight="400" fill="#646A73" text-anchor="start">重新生成或被放弃的回答不会保存；最后一轮在停顿 10 分钟后保存。</text>
<rect x="830" y="856" width="630" height="180" rx="12" fill="#F7F3FF" stroke="#7F3BF5" stroke-width="1.5"/>
<text x="852" y="888" font-size="17" font-weight="700" fill="#1F2329" text-anchor="start">跨轮：压缩长对话</text>
<rect x="852" y="904" width="178" height="72" rx="8" fill="#FFFFFF" stroke="#7F3BF5" stroke-width="1.5"/>
<text x="941" y="935" font-size="14" font-weight="400" fill="#1F2329" text-anchor="middle">用到上下文窗口的 90%</text>
