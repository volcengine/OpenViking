<text x="512.75" y="944.5" font-size="14" font-weight="400" fill="#1F2329" text-anchor="middle">20,000 token，</text>
<text x="512.75" y="963.5" font-size="14" font-weight="400" fill="#1F2329" text-anchor="middle">或停顿 10 分钟</text>
