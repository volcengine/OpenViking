<text x="40" y="546" font-size="14.5" font-weight="400" fill="#646A73" text-anchor="start">OpenViking 超时或不可用时，这条消息不带记忆照常发出，之后也不补。工具步骤跳过 ③；子 Agent、生成标题等辅助请求跳过 ③ 和 ⑤。</text>
<text x="40" y="606" font-size="20" font-weight="700" fill="#1F2329" text-anchor="start">为什么要原样放回：服务商按前缀缓存提示词</text>
