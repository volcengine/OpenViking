apiVersion: v1
kind: Service
metadata:
  name: {{ include "openviking.fullname" . }}
  labels:
    {{- include "openviking.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    {{- if .Values.contextGateway.enabled }}
    - port: {{ .Values.contextGateway.port }}
      targetPort: context-gateway
      protocol: TCP
      name: context-gateway
    {{- end }}
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "openviking.selectorLabels" . | nindent 4 }}
