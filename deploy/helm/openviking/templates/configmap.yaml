{{- $config := deepCopy .Values.config }}
{{- if .Values.contextGateway.enabled }}
{{- $gateway := dict "enabled" true "host" "0.0.0.0" "port" .Values.contextGateway.port "workers" .Values.contextGateway.workers "url" (printf "http://127.0.0.1:%v" .Values.contextGateway.port) "openviking_url" (printf "http://127.0.0.1:%v" (.Values.config.server.port | default 1933)) "storage_path" (printf "%s/context-gateway" .Values.persistence.mountPath) }}
{{- $_ := set $config "context_gateway" (mergeOverwrite $gateway ($config.context_gateway | default dict)) }}
{{- end }}
{{- if empty $config.storage.workspace }}
{{- $_ := set $config.storage "workspace" (printf "%s/openviking_workspace" (trimSuffix "/" .Values.persistence.mountPath)) }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "openviking.fullname" . }}-config
  labels:
    {{- include "openviking.labels" . | nindent 4 }}
data:
  ov.conf: |
    {{- $config | toPrettyJson | nindent 4 }}
