<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" aria-label="OpenViking" focusable="false">
  <title>OpenViking</title>
  <style>
    /* Monochrome mark. The plugin card renders this file as an image document,
       which cannot read the page palette, so the two inks are declared here and
       the scheme flip comes from the only signal an image document gets:
       prefers-color-scheme. The base fill attribute keeps the Ink color in
       renderers that lack that query, and the class is named after the product
       to stay unique if this file is ever inlined. */
    @media (prefers-color-scheme: dark) {
      .openviking-mark { fill: #F4F5F3; }
    }
  </style>
  <path class="openviking-mark" fill="#07090D" d="M3 21H6L18 3H15Z"/>
  <path class="openviking-mark" fill="#07090D" d="M9 21L21 3V21Z"/>
</svg>
