# LLM Wiki contract: page roles start at the output root.
# L1/L2/L3 use configured names; L4+ materializes only for supported knowledge.
# Projection views and mining artifacts are disabled.
version: '1.0'
frontmatter:
  required:
  - type
  - title
  - description
  - tags
  - status
  - sources
  - generated
  - knowledge_links
  allowed_types:
  - entity
  - concept
  - method
  - comparison
  - analysis
  - index
  page_role_directory:
    topic: TOPIC(主题知识:解释对象、概念、产品、机制是什么)
    reference: REFERENCE(精确参考:规则、参数、口径、FAQ、术语)
    procedure: PROCEDURE(操作方法:SOP、流程、排障、审批、实施步骤)
    synthesis: SYNTHESIS(综合分析:对比、分析、决策、复盘、综合研究)
  knowledge_type_directory:
    products: 产品与解决方案
    marketing: 市场与营销
    sales: 销售与商业拓展
    customer-development: 客户经营
    customer-service: 客户服务
    network-planning: 网络规划与调度
    operations: 运营与履约
    quality-safety: 质量与安全
    business-management: 经营与管理
    enterprise-services: 企业综合服务
    human-resource: 人力与组织
    finance: 财务、资金与信用
    technology: 技术、数据与智能化
    compliance: 制度、法务与风险治理
  defaults:
    status: stable
  sources:
    required_fields:
    - resource
    - title
    - author
    require_input: true
    require_intermediate: false
  generated:
    required_fields:
    - by
    - at
    by_template: '{skill}/{model}'
