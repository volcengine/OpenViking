[project]
name = "hermes-plugin-openviking"
version = "2.0.1"
description = "Hermes Agent memory provider plugin: openviking"
requires-python = ">=3.11"
license = { text = "MIT" }
# Installed into the Hermes venv by `hermes plugins install` / `enable` and re-applied after
# every `hermes update` (hermes-agent#113851). Keep upper bounds: Hermes pins its own deps exactly
# and refuses a plugin whose requirements cannot resolve against them.
dependencies = [
    "httpx>=0.27,<1",
    "psutil>=5.9,<8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
