<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OpenViking models</title><link rel="stylesheet" href="style.css"><script src="_magpie/bridge.js"></script><script src="app.js" type="module"></script></head>
<body><main>
<header><h1><img src="logo.png" alt="" width="32" height="32">OpenViking</h1><p data-i18n="intro"></p></header>
<form id="settings">
<div class="roles">
<section class="role" aria-labelledby="vlmTitle"><h2 id="vlmTitle">OpenViking VLM</h2>
<label class="check"><input id="manageVlm" type="checkbox"><span data-i18n="manage"></span></label><p class="hint" data-i18n="vlmHint"></p>
<fieldset id="vlmParameters"><legend class="sr-only">VLM</legend></fieldset></section>
<section class="role" aria-labelledby="botTitle"><h2 id="botTitle">VikingBot</h2>
<label for="botMode" class="sr-only" data-i18n="botMode"></label><select id="botMode"><option value="preserve" data-i18n="preserveBot"></option><option value="follow" data-i18n="follow"></option><option value="independent" data-i18n="independent"></option></select>
<label for="botModel" class="bot-model-label" data-i18n="botModel"></label><input id="botModel" autocomplete="off" placeholder="provider/model · group/name"><p class="hint" data-i18n="botHint"></p>
<fieldset id="botParameters"><legend class="sr-only">VikingBot</legend></fieldset></section>
</div>
<details class="connection"><summary data-i18n="connection"></summary>
<label for="serverUrl" data-i18n="serverUrl"></label><input id="serverUrl" type="url" placeholder="ovcli.conf" autocomplete="off">
<label for="rootApiKeyFile" data-i18n="rootKey"></label><input id="rootApiKeyFile" autocomplete="off"><p class="hint" data-i18n="connectionHint"></p></details>
<div class="activation"><label class="check"><input id="restartOnChange" type="checkbox"><span data-i18n="restart"></span></label><p class="hint" data-i18n="restartHint"></p></div>
<div class="actions"><button type="button" id="saveSettings" disabled data-i18n="save"></button><p id="message" role="status" aria-live="polite"></p></div>
<p class="hint footnote" data-i18n="scope"></p></form>
</main></body></html>
