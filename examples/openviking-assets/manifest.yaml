#   ov add-resource -m manifest.yaml --args dry_run:true
#   ov add-resource -m manifest.yaml
# Simple setups can skip the separate catalog file and define assets inline
# under `catalog:` — see the OpenViking Assets guide.
assets:
  - openviking
  - flask
