[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openviking-llamaparse-bridge"
version = "0.1.0"
description = "LlamaParse v2 adapter for the OpenViking Understanding API"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "OpenViking Contributors" }]
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "python-multipart>=0.0.20",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5",
]
dev = [
  "build>=1,<2",
  "mypy>=1",
  "ruff>=0.1",
  "setuptools>=68",
  "wheel>=0.45",
]

[project.scripts]
openviking-llamaparse-bridge = "openviking_llamaparse_bridge.__main__:main"

[tool.setuptools.packages.find]
include = ["openviking_llamaparse_bridge*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=openviking_llamaparse_bridge --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["B", "C", "E", "F", "I", "W"]
ignore = ["B008", "E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true
