name: OpenViking Gateway Chart
on:
  pull_request:
    paths:
      - "deploy/helm/openviking-gateway/**"
      - "Dockerfile"
      - "openviking_gateway/**"
      - "openviking_cli/utils/config/encryption_config.py"
      - "openviking_cli/utils/config/agfs_config.py"
      - "scripts/gateway_chart_check.py"
      - ".github/workflows/gateway-chart.yml"
  workflow_dispatch:
jobs:
  chart:
    runs-on: ${{ github.repository == 'volcengine/OpenViking' && fromJSON('["self-hosted", "Linux", "X64", "ov-ci-runner"]') || fromJSON('["ubuntu-latest"]') }}
    container: ${{ github.repository == 'volcengine/OpenViking' && 'ubuntu:24.04' || null }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Prepare Linux CI container
        if: github.repository == 'volcengine/OpenViking'
        working-directory: /
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git curl sudo unzip xz-utils
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: azure/setup-helm@v4.3.1
        with:
          version: v3.17.3
      - run: pip install "pydantic>=2" "packaging>=24" "json-repair>=0.25" "loguru>=0.7" "aiohttp>=3.13.3" "orjson>=3.11.7" PyYAML
      - run: PYTHONPATH=. python scripts/gateway_chart_check.py
