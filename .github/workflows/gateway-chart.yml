name: OpenViking Gateway Chart
on:
  pull_request:
    paths:
      - "deploy/helm/openviking-gateway/**"
      - "Dockerfile"
      - "openviking_gateway/**"
      - "openviking_cli/utils/config/encryption_config.py"
      - "openviking_cli/utils/config/agfs_config.py"
      - "scripts/gateway_chart_check.py"
      - ".github/workflows/gateway-chart.yml"
  workflow_dispatch:
    inputs:
      linux_pool:
        description: Ordinary Linux test pool (empty uses CI_LINUX_POOL)
        required: false
        type: string
jobs:
  linux-runner:
    uses: ./.github/workflows/_linux-runner.yml
    with:
      pool: ${{ inputs.linux_pool || '' }}
    secrets:
      CI_RUNNER_READ_TOKEN: ${{ secrets.CI_RUNNER_READ_TOKEN }}

  chart:
    needs: linux-runner
    runs-on: ${{ fromJSON(needs.linux-runner.outputs.runs_on) }}
    container: ubuntu:24.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Install Git before checkout
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates
      - uses: actions/checkout@v4
      - uses: ./.github/actions/linux-test-env
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: azure/setup-helm@v4.3.1
        with:
          version: v3.17.3
      - run: pip install "pydantic>=2" "packaging>=24" "json-repair>=0.25" "loguru>=0.7" "aiohttp>=3.13.3" "orjson>=3.11.7" PyYAML
      - run: PYTHONPATH=. python scripts/gateway_chart_check.py
