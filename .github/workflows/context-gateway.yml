name: Context Gateway
on:
  pull_request:
    paths: ["context_gateway/**", "tests/context_gateway/**", "scripts/*context*gateway*", "openviking/server/routers/context_gateway.py", "openviking_cli/utils/config/context_gateway_config.py", ".github/workflows/context-gateway.yml"]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      # The gateway talks to OpenViking over HTTP only, so its tests run from the
      # source tree with its own dependencies instead of building the native wheel.
      - run: pip install "aiohttp>=3.13.3" "async-timeout>=5.0.1" "orjson>=3.11.7" "packaging>=24.0" "fastapi>=0.128.0" "uvicorn>=0.39.0" "pydantic>=2.0.0" "httpx>=0.25.0" "cryptography>=48.0.1" "mcp>=1.27,<2" pytest pytest-asyncio
      - run: PYTHONPATH=. pytest tests/context_gateway --confcutdir=tests/context_gateway -o addopts=''
