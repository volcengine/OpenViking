name: OpenViking Gateway kind acceptance
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to test (empty uses the selected workflow ref)"
        required: false
      overlay:
        description: "Build the selected ref over the release image"
        type: boolean
        default: true
      base_ref:
        description: "Release tag of the overlay base image (empty uses build_overlay.py's default)"
        required: false
permissions:
  contents: read
jobs:
  kind:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      OV_TEST_GATEWAY_IMAGE: ghcr.io/volcengine/openviking:main
    steps:
      - name: Set kubeconfig path
        run: echo "OV_TEST_KIND_KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: azure/setup-helm@v4.3.1
        with:
          version: v3.17.3
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install test clients and kind
        run: |
          pip install pytest httpx openai==3.37.0 anthropic==2.2.0
          npm install --global @openai/codex@0.146.0
          curl -fsSL https://kind.sigs.k8s.io/dl/v0.27.0/kind-linux-amd64 -o /usr/local/bin/kind
          chmod +x /usr/local/bin/kind
          mkdir -p artifacts
      - name: Create dedicated three-node cluster
        run: kind create cluster --name ovgw-e2e --config tests/gateway/e2e/kind.yaml --kubeconfig "$OV_TEST_KIND_KUBECONFIG" --wait 120s
      - name: Build source overlay for a manual run
        if: github.event_name == 'workflow_dispatch' && inputs.overlay
        env:
          BASE_REF: ${{ inputs.base_ref }}
        run: |
          python tests/gateway/e2e/build_overlay.py ${BASE_REF:+--base-ref "$BASE_REF"} --tag ovgw-e2e:local
          echo 'OV_TEST_GATEWAY_IMAGE=ovgw-e2e:local' >> "$GITHUB_ENV"
      - name: Load test images
        run: |
          docker image inspect "$OV_TEST_GATEWAY_IMAGE" >/dev/null 2>&1 || docker pull "$OV_TEST_GATEWAY_IMAGE"
          docker pull redis:7.2-alpine
          python tests/gateway/e2e/load_images.py --cluster ovgw-e2e "$OV_TEST_GATEWAY_IMAGE" redis:7.2-alpine
      - name: Run standalone and Cluster matrices
        run: pytest tests/gateway/e2e --confcutdir=tests/gateway/e2e -o addopts='' -v --basetemp=artifacts/pytest --junitxml=artifacts/results.xml
      - name: Collect cluster evidence
        if: always()
        run: |
          kind export logs artifacts/kind --name ovgw-e2e || true
          kubectl --kubeconfig "$OV_TEST_KIND_KUBECONFIG" get pods -A -o wide > artifacts/pods.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gateway-kind-evidence
          path: artifacts
