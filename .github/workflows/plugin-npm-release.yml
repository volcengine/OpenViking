name: Plugin npm Release

# Publishes the memory plugins that ship as npm packages. One push filter covers
# every package in the matrix, so a change to one of them also starts the other
# legs; those legs stop at the already-published check instead of republishing.

on:
  push:
    branches: [main]
    paths:
      - "examples/dsh-memory-plugin/**"
      - "examples/opencode-plugin/**"
      - "examples/memory-plugin-shared/lib/**"
      - ".github/workflows/plugin-npm-release.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish ${{ matrix.package }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: "@openviking/dsh-memory-plugin"
            directory: examples/dsh-memory-plugin
            install: npm ci
          - package: "@openviking/opencode-plugin"
            directory: examples/opencode-plugin
            # No lockfile in this package, so npm ci cannot run here.
            install: npm install
    concurrency:
      group: plugin-npm-release-${{ matrix.directory }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: ${{ matrix.install }}

      - name: Validate package
        run: |
          npm run check
          npm test
          npm pack --dry-run

      - name: Resolve package version
        id: package
        env:
          EXPECTED_NAME: ${{ matrix.package }}
        run: |
          node -e "
            const pkg = require('./package.json')
            if (pkg.name !== process.env.EXPECTED_NAME) {
              throw new Error('Unexpected package name: ' + pkg.name)
            }
            console.log('name=' + pkg.name)
            console.log('version=' + pkg.version)
          " >> "$GITHUB_OUTPUT"

      - name: Check whether version already exists
        id: published
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$PACKAGE_NAME@$PACKAGE_VERSION is already published; skipping."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish package
        if: steps.published.outputs.exists == 'false'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "${NPM_TOKEN:-}" ]; then
            npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          else
            echo "::notice::NPM_TOKEN is not set; npm publish will use Trusted Publishing/OIDC. For first-time packages, publish once with an npm token or configure npm trusted publishing after the package exists."
          fi
          npm publish --access public --provenance
