name: Publish CI Base Image

on:
  workflow_dispatch:
    inputs:
      version:
        description: Compatibility input for the registered Docker workflow
        type: string
        default: ci-ubuntu24
      publish:
        description: Publish the validated CI image to GHCR
        type: boolean
        default: true

jobs:
  ci-image:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/ci-linux-image.yml
    with:
      publish: ${{ inputs.publish }}
