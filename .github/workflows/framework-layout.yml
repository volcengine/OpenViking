name: Framework Integration Layout

on:
  pull_request:
    paths:
      - 'integrations/frameworks/**'
      - 'openviking/integrations/**'
      - 'examples/langchain/**'
      - 'examples/langchain-langgraph/**'
      - 'examples/agent-framework/**'
      - 'tests/unit/test_langchain_*.py'
      - 'tests/integration/langchain_langgraph/**'
      - '.github/workflows/framework-layout.yml'
  push:
    branches: [main]
    paths:
      - 'integrations/frameworks/**'
      - 'openviking/integrations/**'
      - 'examples/langchain/**'
      - 'examples/langchain-langgraph/**'
      - 'examples/agent-framework/**'
      - 'tests/unit/test_langchain_*.py'
      - 'tests/integration/langchain_langgraph/**'
      - '.github/workflows/framework-layout.yml'

permissions:
  contents: read

jobs:
  layout:
    name: Framework package locations
    runs-on: ${{ github.repository == 'volcengine/OpenViking' && fromJSON('["self-hosted", "Linux", "X64", "ov-ci-runner"]') || fromJSON('["ubuntu-24.04"]') }}
    container: ${{ github.repository == 'volcengine/OpenViking' && 'ubuntu:24.04' || null }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Prepare Linux CI container
        if: github.repository == 'volcengine/OpenViking'
        working-directory: /
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git curl unzip xz-utils
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install test runner
        run: python -m pip install pytest
      - name: Check framework package locations
        # These guards need only pytest and Git, without server-test configuration.
        run: >-
          python -m pytest -q --noconftest --rootdir=. -c /dev/null
          tests/unit/test_langchain_package_boundary.py
          -k 'server_source_excludes_removed_framework_namespace or framework_sources_and_tests_use_package_locations'
