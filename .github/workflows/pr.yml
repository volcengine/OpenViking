name: 01. Pull Request Checks

on:
  workflow_dispatch:
  pull_request:
    branches: [ main, develop ]
    paths-ignore:
      - 'docs/**'
      - 'bot/docs/**'
      - 'LICENSE'
      - 'CONTRIBUTING.md'
      - '**.png'
      - '**.jpg'
      - '**.jpeg'
      - '**.gif'
      - '**.svg'
      - '.gitignore'
      - '.editorconfig'
      - 'vika/**'

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plugin-tests:
    needs: check-deps
    if: needs.check-deps.outputs.plugins_changed == 'true'
    runs-on: ubuntu-24.04
    env:
      # The tests that fork whole installs, named once: the step below runs
      # exactly what the parallel run subtracts, so renaming one cannot leave
      # it in both.
      INSTALLER_TESTS: >-
        examples/memory-plugin-shared/install-agent-hooks.test.mjs
        examples/memory-plugin-shared/release-marketplace.test.mjs
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          # 24+: the pi extension tests import .ts glue directly via native type stripping.
          node-version: '24'

      - run: npm ci --prefix examples/dsh-memory-plugin
      - run: npm ci --prefix examples/pi-coding-agent-extension --ignore-scripts

      # The plugins published as packages keep no shared copies in git; they are
      # built on the way out, and the tests import them like the package would.
      - name: Generate the shared runtime copies
        run: node examples/memory-plugin-shared/sync.mjs

      - name: Committed generator output must be up to date
        run: |
          # A module the closure grew reaches the committed lanes as an
          # untracked file, which `git diff` does not see at all.
          status=$(git status --porcelain --untracked-files=normal -- examples agent-plugins)
          if [ -n "$status" ]; then
            printf '%s\n' "$status"
            exit 1
          fi
          git diff --exit-code

      - name: Run memory plugin tests
        run: |
          # A pattern no plugin matches yet contributes nothing rather than
          # reaching node as a literal.
          shopt -s nullglob
          files=$(printf '%s\n' \
            examples/*/scripts/*.test.mjs \
            examples/*/scripts/lib/*.test.mjs \
            examples/*/servers/*.test.mjs \
            examples/*/tests/*.test.mjs \
            examples/*-plugin/*.test.mjs \
            examples/memory-plugin-shared/*.test.mjs \
            agent-plugins/*.test.mjs \
            | grep -vFxf <(printf '%s\n' $INSTALLER_TESTS))
          node --test $files

      # Staging the marketplace regenerates the shared copies the rest of the
      # suite imports, and both tests fork whole installs, so they run alone.
      - name: Run the installer tests
        run: node --test --test-concurrency=1 $INSTALLER_TESTS

      - name: Check installer scripts parse
        run: |
          bash -n .github/scripts/stage-memory-plugin-marketplace.sh
          bash -n examples/memory-plugin-shared/install.sh
          bash -n examples/claude-code-memory-plugin/setup-helper/install.sh
          bash -n examples/claude-code-memory-plugin/setup-helper/tos-install.sh
          bash -n examples/codex-memory-plugin/setup-helper/install.sh
          bash -n examples/codex-memory-plugin/setup-helper/tos-install.sh

  openclaw-tests:
    needs: check-deps
    if: ${{ needs.check-deps.outputs.openclaw_changed == 'true' }}
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: examples/openclaw-plugin
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Generate the shared runtime copies
        run: node ../memory-plugin-shared/sync.mjs

      - name: Install plugin dependencies
        run: npm ci --ignore-scripts

      - name: Run the OpenClaw plugin Vitest suite
        # The suite is otherwise never exercised by CI, so regressions in
        # examples/openclaw-plugin only surface in user installs.
        # tests/ut/architecture-boundaries.test.ts is excluded until its 2
        # pre-existing failures are resolved (see #4720 / #4731 / #4732);
        # every other file passes (42 files / 675 tests).
        # The node_modules exclude restores vitest's default filters, which a
        # custom --exclude replaces.
        run: >
          npm test --
          --exclude "tests/ut/architecture-boundaries.test.ts"
          --exclude "**/node_modules/**"

  plugin-versions:
    needs: check-deps
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request' && needs.check-deps.outputs.plugins_changed == 'true'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Plugins that changed must move their version string
        run: |
          git fetch --quiet origin ${{ github.base_ref }}
          bash .github/scripts/check-plugin-version-bumps.sh "origin/${{ github.base_ref }}"

  check-deps:
    runs-on: ubuntu-24.04
    outputs:
      deps_changed: ${{ steps.check.outputs.deps_changed }}
      wheel_os: ${{ steps.check.outputs.wheel_os }}
      plugins_changed: ${{ steps.check.outputs.plugins_changed }}
      langchain_changed: ${{ steps.check.outputs.langchain_changed }}
      openclaw_changed: ${{ steps.check.outputs.openclaw_changed }}
      sdk_python_changed: ${{ steps.check.outputs.sdk_python_changed }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check for dependency changes
        id: check
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            python3 .github/scripts/ci_plan.py --base "$BASE_SHA" --output "$GITHUB_OUTPUT"
          else
            python3 .github/scripts/ci_plan.py --full --output "$GITHUB_OUTPUT"
          fi
      - name: Test packaging and CI selection contracts
        run: |
          python3 -m pip install pytest
          python3 -m pytest --noconftest -q -o addopts='' \
            tests/misc/test_abi3_packaging_config.py \
            tests/misc/test_release_tag_selection.py

  build:
    needs: check-deps
    if: ${{ needs.check-deps.outputs.deps_changed == 'true' }}
    uses: ./.github/workflows/_build.yml
    with:
      os_json: ${{ needs.check-deps.outputs.wheel_os }}

  sdk-python-tests:
    needs: check-deps
    if: ${{ needs.check-deps.outputs.sdk_python_changed == 'true' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.12"]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install standalone SDK test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e sdk/python "pytest<8" "pytest-asyncio<0.22"

      - name: Run standalone SDK tests
        run: |
          python -m pytest -q sdk/python/tests \
            -o addopts='' \
            --ignore=sdk/python/tests/test_legacy_shims.py \
            --ignore=sdk/python/tests/test_main_package_exports.py

      - name: Build and test installed wheel
        if: matrix.python-version == '3.8'
        run: |
          python -m pip install "build<1.3"
          python -m build sdk/python
          python -m venv /tmp/openviking-sdk-wheel
          WHEEL_PATH=$(find sdk/python/dist -name '*.whl' -print -quit)
          /tmp/openviking-sdk-wheel/bin/python -m pip install "$WHEEL_PATH"
          cd /tmp
          /tmp/openviking-sdk-wheel/bin/python -c "import openviking_sdk"

  langchain-tests:
    needs: check-deps
    if: ${{ needs.check-deps.outputs.langchain_changed == 'true' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install standalone integration
        run: |
          uv pip install --system -e sdk/python
          uv pip install --system -e "integrations/frameworks/langchain[langgraph,test,dev]"

      - name: Check package formatting and lint
        run: |
          ruff format --check \
            integrations/frameworks/langchain/src \
            integrations/frameworks/langchain/tests \
            tests/unit/test_langchain_package_boundary.py
          ruff check \
            integrations/frameworks/langchain/src \
            integrations/frameworks/langchain/tests \
            tests/unit/test_langchain_package_boundary.py

      - name: Type-check package
        run: >-
          mypy
          --config-file integrations/frameworks/langchain/pyproject.toml
          integrations/frameworks/langchain/src/langchain_openviking

      - name: Run LangChain and LangGraph tests
        run: |
          python -m pytest -q --noconftest -o addopts='' \
            integrations/frameworks/langchain/tests \
            tests/unit/test_langchain_package_boundary.py

      - name: Build and inspect distributions
        run: |
          python -m build integrations/frameworks/langchain
          python -m twine check integrations/frameworks/langchain/dist/*

      - name: Verify the installed wheel
        if: matrix.python-version == '3.12'
        run: |
          WHEEL_PATH="${GITHUB_WORKSPACE}/$(find integrations/frameworks/langchain/dist -name '*.whl' -print -quit)"
          uv venv .langchain-wheel-venv --python "${{ matrix.python-version }}"
          uv pip install \
            --python .langchain-wheel-venv/bin/python \
            sdk/python \
            "${WHEEL_PATH}"
          cd /tmp
          "${GITHUB_WORKSPACE}/.langchain-wheel-venv/bin/python" \
            "${GITHUB_WORKSPACE}/integrations/frameworks/langchain/tests/installed_base_smoke.py"
          uv pip install \
            --python "${GITHUB_WORKSPACE}/.langchain-wheel-venv/bin/python" \
            "${WHEEL_PATH}[langgraph]"
          "${GITHUB_WORKSPACE}/.langchain-wheel-venv/bin/python" \
            "${GITHUB_WORKSPACE}/integrations/frameworks/langchain/tests/installed_smoke.py"
          uv pip check --python "${GITHUB_WORKSPACE}/.langchain-wheel-venv/bin/python"
