name: Microsoft Agent Framework Integration

on:
  pull_request:
    paths:
      - 'integrations/frameworks/microsoft-agent-framework/**'
      - 'examples/agent-framework/**'
      - '.github/workflows/python-agent-framework.yml'
      - '.github/workflows/python-agent-framework-release.yml'
  push:
    branches: [main]
    paths:
      - 'integrations/frameworks/microsoft-agent-framework/**'
      - 'examples/agent-framework/**'
      - '.github/workflows/python-agent-framework.yml'
      - '.github/workflows/python-agent-framework-release.yml'

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ${{ github.repository == 'volcengine/OpenViking' && fromJSON('["self-hosted", "Linux", "X64", "ov-ci-runner"]') || fromJSON('["ubuntu-24.04"]') }}
    container: ${{ github.repository == 'volcengine/OpenViking' && 'ubuntu:24.04' || null }}
    strategy:
      matrix:
        include:
          - maf: 'agent-framework-core==1.20.0'
            sdk: 'openviking-sdk==0.1.13'
          - maf: 'agent-framework-core>=1.20,<2'
            sdk: 'openviking-sdk>=0.1.13,<0.2'
    defaults:
      run:
        shell: bash
        working-directory: integrations/frameworks/microsoft-agent-framework
    steps:
      - name: Prepare Linux CI container
        if: github.repository == 'volcengine/OpenViking'
        working-directory: /
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git curl sudo unzip xz-utils build-essential
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install supported dependencies
        run: python -m pip install '.[test,dev]' '${{ matrix.maf }}' '${{ matrix.sdk }}'
      - name: Check package and offline contracts
        run: |
          ruff check .
          ruff format --check .
          mypy src
          pytest -q --confcutdir=tests tests
          python -m build
          python -m twine check dist/*
