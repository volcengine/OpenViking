name: 17. _Docs Build

on:
  workflow_call:

jobs:
  build:
    name: Build Docs
    runs-on: ${{ github.repository == 'volcengine/OpenViking' && fromJSON('["self-hosted", "Linux", "X64", "ov-ci-runner"]') || fromJSON('["ubuntu-24.04"]') }}
    container: ${{ github.repository == 'volcengine/OpenViking' && 'ubuntu:24.04' || null }}
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
    steps:
      - name: Prepare Linux CI container
        if: github.repository == 'volcengine/OpenViking'
        working-directory: /
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git curl unzip xz-utils python3
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install docs dependencies
        run: npm ci
        working-directory: docs

      - name: Test docs theme
        run: npm run test:theme
        working-directory: docs

      - name: Check bilingual docs and examples
        run: npm run check:docs
        working-directory: docs

      - name: Check API reference
        run: npm run check:api
        working-directory: docs

      - name: Build docs
        run: npm run docs:build
        working-directory: docs
        env:
          DOCS_BASE: /

      - name: Check built section links
        run: python3 scripts/check-built-anchors.py
        working-directory: docs
        env:
          DOCS_BASE: /
