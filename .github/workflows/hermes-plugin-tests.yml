name: Hermes Plugin Tests

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'examples/hermes-plugin/**'
      - '.github/workflows/hermes-plugin-tests.yml'
      - 'scripts/check-hermes-plugin-install.py'
      - 'scripts/check-hermes-quick-local.py'
  push:
    branches: [main, develop]
    paths:
      - 'examples/hermes-plugin/**'
      - '.github/workflows/hermes-plugin-tests.yml'
      - 'scripts/check-hermes-plugin-install.py'
      - 'scripts/check-hermes-quick-local.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hermes-plugin-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hermes-plugin-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check out the reviewed Hermes test host
        uses: actions/checkout@v6
        with:
          repository: ehz0ah/hermes-agent
          ref: 837617717c045f70c0a68121d11295534b9f9a33
          path: .ci/hermes-agent
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.12.3'
          enable-cache: true
          cache-dependency-glob: |
            .ci/hermes-agent/uv.lock
            .ci/hermes-agent/pm/lock.json

      - name: Build the reviewed host test environment
        working-directory: .ci/hermes-agent
        run: |
          python scripts/write_install_stamp.py --output install-stamp.json \
            --base-version 0.22.5 --source ci --update-mechanism self
          python -m pm.build_env --source . --out .venv --group dev --group test

      - name: Run the external memory provider tests
        working-directory: .ci/hermes-agent
        env:
          HERMES_TEST_FILE_RETRIES: '0'
          HERMES_TEST_WORKERS: '2'
        run: |
          HERMES_PYTHON="$PWD/.venv/bin/python" scripts/run_tests.sh \
            "$GITHUB_WORKSPACE/examples/hermes-plugin/tests" \
            --confcutdir="$GITHUB_WORKSPACE/examples/hermes-plugin/tests" -p no:cacheprovider -q

      - name: Check real plugin installation and activation
        working-directory: .ci/hermes-agent
        run: |
          .venv/bin/python "$GITHUB_WORKSPACE/scripts/check-hermes-plugin-install.py" \
            --hermes-root "$PWD" \
            --output-dir "$RUNNER_TEMP/hermes-plugin-install"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hermes-plugin-install-logs
          path: |
            ${{ runner.temp }}/hermes-plugin-install/*.log
            ${{ runner.temp }}/hermes-plugin-install/evidence.json
          if-no-files-found: ignore

  quick-local-platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-14, windows-2025]
        host: [main]
        include:
          - os: ubuntu-24.04
            host: release
            python: '3.14'
            hermes_repo: NousResearch/hermes-agent
            hermes_ref: v0.22.5
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: .ci/hermes-agent
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: ${{ matrix.hermes_repo || 'ehz0ah/hermes-agent' }}
          ref: ${{ matrix.hermes_ref || '837617717c045f70c0a68121d11295534b9f9a33' }}
          path: .ci/hermes-agent
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python || '3.14' }}
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.12.3'
          enable-cache: true
          cache-dependency-glob: |
            .ci/hermes-agent/uv.lock
            .ci/hermes-agent/pm/lock.json
            examples/hermes-plugin/local_packages.py
      - name: Install the reviewed host and test dependencies
        run: |
          python scripts/write_install_stamp.py --output install-stamp.json \
            --base-version 0.22.5 --source ci --update-mechanism self
          python -m pm.build_env --source . --out .venv --group dev --group test
          if [ -x .venv/Scripts/python.exe ]; then
            PYTHON="$PWD/.venv/Scripts/python.exe"
          else
            PYTHON="$PWD/.venv/bin/python"
          fi
          echo "HERMES_PYTHON=$PYTHON" >> "$GITHUB_ENV"
      - name: Check process ownership and installer failures
        env:
          HERMES_TEST_FILE_RETRIES: '0'
          HERMES_TEST_WORKERS: '2'
        run: |
          scripts/run_tests.sh \
            "$GITHUB_WORKSPACE/examples/hermes-plugin/tests/test_local_lifecycle.py" \
            "$GITHUB_WORKSPACE/examples/hermes-plugin/tests/test_quick_local.py" \
            "$GITHUB_WORKSPACE/examples/hermes-plugin/tests/test_quick_local_routes.py" \
            "$GITHUB_WORKSPACE/examples/hermes-plugin/tests/test_quick_local_preflight.py" \
            "$GITHUB_WORKSPACE/examples/hermes-plugin/tests/test_mcp_profile_binding.py" \
            --confcutdir="$GITHUB_WORKSPACE/examples/hermes-plugin/tests" -p no:cacheprovider -q
      - name: Run the complete provider suite on the release host
        if: matrix.host == 'release'
        env:
          HERMES_TEST_FILE_RETRIES: '0'
          HERMES_TEST_WORKERS: '2'
        run: |
          scripts/run_tests.sh "$GITHUB_WORKSPACE/examples/hermes-plugin/tests" \
            --confcutdir="$GITHUB_WORKSPACE/examples/hermes-plugin/tests" -p no:cacheprovider -q
      - name: Check real plugin installation on Windows
        if: ${{ !cancelled() && runner.os == 'Windows' && env.HERMES_PYTHON != '' }}
        run: |
          "$HERMES_PYTHON" "$GITHUB_WORKSPACE/scripts/check-hermes-plugin-install.py" \
            --hermes-root "$PWD" \
            --output-dir "$RUNNER_TEMP/hermes-plugin-install" \
            --install-only
      - name: Install and run real Quick Local services
        run: |
          "$HERMES_PYTHON" "$GITHUB_WORKSPACE/scripts/check-hermes-quick-local.py" \
            --hermes-root "$PWD" --output-dir "$RUNNER_TEMP/quick-local"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quick-local-${{ matrix.os }}-${{ matrix.host }}
          path: |
            ${{ runner.temp }}/quick-local/evidence.json
            ${{ runner.temp }}/quick-local/*/logs/openviking-server.log
            ${{ runner.temp }}/hermes-plugin-install/*.log
            ${{ runner.temp }}/hermes-plugin-install/evidence.json
          if-no-files-found: ignore
