name: Hermes Plugin Tests

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'examples/hermes-plugin/**'
      - '.github/workflows/hermes-plugin-tests.yml'
      - 'scripts/check-hermes-plugin-install.py'
      - 'scripts/check-hermes-quick-local.py'
  push:
    branches: [main, develop]
    paths:
      - 'examples/hermes-plugin/**'
      - '.github/workflows/hermes-plugin-tests.yml'
      - 'scripts/check-hermes-plugin-install.py'
      - 'scripts/check-hermes-quick-local.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hermes-plugin-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hermes-plugin-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        host:
          - name: baseline
            ref: 5bba024d8ddd388f56f354c1f789be825e3d8a3c
          # Reviewed companion: exercises Desktop setup instead of skipping it.
          - name: desktop-setup
            ref: 29d4956856295189a59ee2eeadc435d46719fd15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check out the reviewed Hermes test host
        uses: actions/checkout@v6
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ matrix.host.ref }}
          path: .ci/hermes-agent
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.12.3'
          enable-cache: true
          cache-dependency-glob: |
            .ci/hermes-agent/uv.lock
            examples/hermes-plugin/pyproject.toml

      - name: Install the host and plugin test dependencies
        working-directory: .ci/hermes-agent
        run: |
          uv sync --frozen --group dev --no-install-project
          uv export --frozen --group dev --no-emit-project --no-hashes \
            --output-file "$RUNNER_TEMP/hermes-plugin-constraints.txt"
          # Keep plugin dependencies within the reviewed host pins. PyYAML
          # is used by the test fixtures; its version matches Hermes's lock.
          uv pip install --python .venv/bin/python \
            --constraint "$RUNNER_TEMP/hermes-plugin-constraints.txt" \
            --requirement "$GITHUB_WORKSPACE/examples/hermes-plugin/pyproject.toml" \
            'PyYAML==6.0.3'

      - name: Run the external memory provider tests
        working-directory: .ci/hermes-agent
        env:
          HERMES_TEST_FILE_RETRIES: '0'
          HERMES_TEST_WORKERS: '2'
        run: |
          HERMES_PYTHON="$PWD/.venv/bin/python" scripts/run_tests.sh \
            "$GITHUB_WORKSPACE/examples/hermes-plugin/tests" \
            --confcutdir="$GITHUB_WORKSPACE/examples/hermes-plugin/tests" -p no:cacheprovider -q

      - name: Check real plugin installation and activation
        working-directory: .ci/hermes-agent
        run: |
          .venv/bin/python "$GITHUB_WORKSPACE/scripts/check-hermes-plugin-install.py" \
            --hermes-root "$PWD" \
            --output-dir "$RUNNER_TEMP/hermes-plugin-install"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hermes-plugin-install-logs-${{ matrix.host.name }}
          path: |
            ${{ runner.temp }}/hermes-plugin-install/*.log
            ${{ runner.temp }}/hermes-plugin-install/evidence.json
          if-no-files-found: ignore

  quick-local-platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-14, windows-2025]
        host: [main]
        include:
          - os: ubuntu-24.04
            host: release
            python: '3.13'
            hermes_ref: e3dd27ee2d8b011737a4eea8e3eb3d711ab78690 # v2026.9.24, pre-PM
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: .ci/hermes-agent
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ matrix.hermes_ref || '5bba024d8ddd388f56f354c1f789be825e3d8a3c' }}
          path: .ci/hermes-agent
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python || '3.14' }}
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.12.3'
          enable-cache: true
          cache-dependency-glob: |
            .ci/hermes-agent/uv.lock
            examples/hermes-plugin/local_packages.py
      - name: Install the reviewed host and test dependencies
        run: |
          if [ '${{ matrix.host }}' = release ]; then
            uv sync --frozen --extra dev --no-install-project
          else
            uv sync --frozen --group dev --no-install-project
          fi
          PYTHON=$(uv run --no-sync python -c 'import sys; print(sys.executable)')
          uv pip install --python "$PYTHON" PyYAML==6.0.3
      - name: Check process ownership and installer failures
        run: |
          uv run --no-sync python -m pytest \
            "$GITHUB_WORKSPACE/examples/hermes-plugin/tests/test_local_lifecycle.py" \
            "$GITHUB_WORKSPACE/examples/hermes-plugin/tests/test_quick_local.py" \
            "$GITHUB_WORKSPACE/examples/hermes-plugin/tests/test_quick_local_routes.py" \
            "$GITHUB_WORKSPACE/examples/hermes-plugin/tests/test_quick_local_preflight.py" \
            --confcutdir="$GITHUB_WORKSPACE/examples/hermes-plugin/tests" -p no:cacheprovider -q
      - name: Install and run real Quick Local services
        run: |
          ARGS=()
          if [ '${{ matrix.host }}' = release ]; then ARGS+=(--legacy-uv); fi
          uv run --no-sync python "$GITHUB_WORKSPACE/scripts/check-hermes-quick-local.py" \
            --hermes-root "$PWD" --output-dir "$RUNNER_TEMP/quick-local" "${ARGS[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quick-local-${{ matrix.os }}-${{ matrix.host }}
          path: |
            ${{ runner.temp }}/quick-local/evidence.json
            ${{ runner.temp }}/quick-local/*/logs/openviking-server.log
          if-no-files-found: ignore
