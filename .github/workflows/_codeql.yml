name: 14. _CodeQL Scan

on:
  workflow_call:
  workflow_dispatch:

jobs:
  select-languages:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      languages: ${{ steps.select.outputs.languages }}
    steps:
    - name: Checkout history for change detection
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Test CodeQL language selection
      run: python3 -m unittest discover -s tests/misc -p test_codeql_selection.py

    - name: Select changed languages
      id: select
      env:
        EVENT_NAME: ${{ github.event_name }}
        BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      run: |
        python3 .github/scripts/codeql_plan.py \
          --event "$EVENT_NAME" --base "$BASE_SHA" --head "$HEAD_SHA" \
          --output "$GITHUB_OUTPUT"

  analyze:
    name: Analyze
    needs: select-languages
    if: needs.select-languages.outputs.languages != '[]'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.select-languages.outputs.languages) }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential

    - name: Install dependencies
      run: |
        # Install dependencies without invoking the project's native builds.
        uv sync --frozen --no-install-project
        uv pip install setuptools setuptools_scm cmake wheel

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        queries: security-and-quality

    - name: Build extensions
      if: matrix.language == 'cpp'
      env:
        OV_SKIP_OV_BUILD: '1'
        OV_SKIP_RAGFS_BUILD: '1'
        OV_SKIP_STUDIO_BUILD: '1'
      # Compile C++ once after CodeQL initialization so its extractor observes it.
      run: uv run --no-sync python setup.py build_ext --inplace

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{ matrix.language }}"
