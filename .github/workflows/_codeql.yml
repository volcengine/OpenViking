name: 14. _CodeQL Scan

on:
  workflow_call:
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze
    runs-on: ${{ github.repository == 'volcengine/OpenViking' && fromJSON('["self-hosted", "Linux", "X64", "ov-ci-runner"]') || fromJSON('["ubuntu-24.04"]') }}
    container: ${{ github.repository == 'volcengine/OpenViking' && 'ubuntu:24.04' || null }}
    defaults:
      run:
        shell: bash
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'python', 'cpp' ]

    steps:
    - name: Prepare Linux CI container
      if: github.repository == 'volcengine/OpenViking'
      working-directory: /
      run: |
        apt-get update
        apt-get install -y --no-install-recommends \
          ca-certificates git curl sudo unzip xz-utils zip jq procps \
          build-essential cmake ccache pkg-config libssl-dev libffi-dev
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - uses: actions/setup-node@v6
      with:
        node-version: '22'

    - uses: dtolnay/rust-toolchain@v1
      with:
        toolchain: stable

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential

    - name: Install dependencies
      run: |
        uv sync --frozen
        uv pip install setuptools setuptools_scm cmake wheel

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        queries: security-and-quality

    - name: Build extensions
      if: matrix.language == 'cpp'
      run: uv run python setup.py build_ext --inplace

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{ matrix.language }}"
