name: 12. _Test Suite (Lite)

on:
  workflow_call:
    secrets:
      CI_RUNNER_READ_TOKEN:
        required: false
    inputs:
      linux_pool:
        description: Ordinary Linux test pool (empty uses CI_LINUX_POOL)
        required: false
        type: string
        default: ''
      native_artifact:
        description: 'Validated same-run cp310-abi3 native runtime (empty builds locally)'
        required: false
        type: string
        default: ''
      os_json:
        description: 'JSON string of OS to run on'
        required: false
        type: string
        default: '["ubuntu-24.04"]'
      python_json:
        description: 'JSON string of Python versions'
        required: false
        type: string
        default: '["3.10"]'
  workflow_dispatch:
    inputs:
      linux_pool:
        description: Ordinary Linux test pool (empty uses CI_LINUX_POOL)
        required: false
        type: string
      os_json:
        description: 'JSON string of OS to run on'
        required: false
        default: '["ubuntu-24.04"]'
      python_json:
        description: 'JSON string of Python versions'
        required: false
        default: '["3.10"]'

jobs:
  linux-runner:
    uses: ./.github/workflows/_linux-runner.yml
    with:
      pool: ${{ inputs.linux_pool || '' }}
    secrets:
      CI_RUNNER_READ_TOKEN: ${{ secrets.CI_RUNNER_READ_TOKEN }}

  test-lite:
    needs: linux-runner
    name: Lite Test (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os == 'ubuntu-24.04' && fromJSON(needs.linux-runner.outputs.runs_on) || matrix.os }}
    container: ${{ matrix.os == 'ubuntu-24.04' && 'ubuntu:24.04' || '' }}
    defaults:
      run:
        shell: ${{ contains(matrix.os, 'windows') && 'pwsh' || 'bash' }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJson(inputs.os_json) }}
        python-version: ${{ fromJson(inputs.python_json) }}

    steps:
    - name: Install Git before checkout
      if: matrix.os == 'ubuntu-24.04'
      run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates
    - uses: actions/checkout@v6
      with:
        submodules: recursive
    - uses: ./.github/actions/linux-test-env
      if: matrix.os == 'ubuntu-24.04'

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true

    - name: Install system dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential

    - name: Install system dependencies (macOS)
      if: runner.os == 'macOS'
      run: brew install cmake

    - name: Install system dependencies (Windows)
      if: runner.os == 'Windows'
      run: |
        choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System'
        choco install mingw

    - name: Add MinGW to PATH (Windows)
      if: runner.os == 'Windows'
      run: echo "C:\mingw64\bin" >> $env:GITHUB_PATH

    - name: Prepare native runtime
      uses: ./.github/actions/native-runtime
      with:
        artifact: ${{ inputs.native_artifact || '' }}

    - name: Run cuVS CPU-only regression tests
      run: |
        uv run --no-sync pytest -q -o addopts='' \
          tests/vectordb/test_cuvs_config.py \
          tests/vectordb/test_cuvs_index.py \
          tests/vectordb/test_cuvs_collection.py \
          tests/vectordb/test_str_to_uint64.py
