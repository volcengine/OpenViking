name: 13. _Test Suite (Full)

on:
  workflow_call:
    inputs:
      os_json:
        description: 'JSON string of OS to run on'
        required: false
        type: string
        default: '["ubuntu-24.04", "macos-15", "windows-latest"]'
      python_json:
        description: 'JSON string of Python versions'
        required: false
        type: string
        default: '["3.10", "3.11", "3.12", "3.13"]'
  workflow_dispatch:
    inputs:
      os_json:
        description: 'JSON string of OS to run on'
        required: false
        default: '["ubuntu-24.04", "macos-15", "windows-latest"]'
      python_json:
        description: 'JSON string of Python versions'
        required: false
        default: '["3.10", "3.11", "3.12", "3.13"]'

jobs:
  test:
    name: Full Test (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    container:
      image: ${{ matrix.os == 'ubuntu-24.04' && (vars.CI_UBUNTU24_IMAGE || 'ubuntu:24.04') || '' }}
      options: --volume /etc/ssl/certs/ca-certificates.crt:/tmp/runner-ca-certificates.crt:ro
    defaults:
      run:
        shell: ${{ startsWith(matrix.os, 'windows-') && 'pwsh' || 'bash' }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJson(inputs.os_json || '["ubuntu-24.04", "macos-15", "windows-latest"]') }}
        python-version: ${{ fromJson(inputs.python_json || '["3.10", "3.11", "3.12", "3.13"]') }}

    steps:
    - name: Bootstrap Ubuntu test container
      if: matrix.os == 'ubuntu-24.04'
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        packages=(git ca-certificates curl python3 cmake build-essential pkg-config libssl-dev ccache unzip xz-utils)
        ready=true
        for package in "${packages[@]}"; do
          if ! dpkg-query -W -f='${Status}' "$package" 2>/dev/null | grep -qx 'install ok installed'; then
            ready=false
            break
          fi
        done
        if "$ready"; then
          echo "System dependencies are already installed in the CI image."
          exit 0
        fi
        sed -i 's|http://|https://|g' /etc/apt/sources.list.d/ubuntu.sources
        apt-get -o Acquire::https::CaInfo=/tmp/runner-ca-certificates.crt \
          -o Acquire::Retries=2 -o Acquire::https::Timeout=20 \
          -o APT::Update::Error-Mode=any update
        apt-get -o Acquire::https::CaInfo=/tmp/runner-ca-certificates.crt \
          -o Acquire::Retries=2 -o Acquire::https::Timeout=20 \
          install -y --no-install-recommends "${packages[@]}"
    - uses: actions/checkout@v6
      with:
        submodules: recursive
    - uses: ./.github/actions/linux-test-env
      if: matrix.os == 'ubuntu-24.04'

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true

    - name: Install system dependencies (macOS)
      if: runner.os == 'macOS'
      run: brew install cmake

    - name: Install system dependencies (Windows)
      if: runner.os == 'Windows'
      run: |
        choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System'
        choco install mingw

    - name: Add MinGW to PATH (Windows)
      if: runner.os == 'Windows'
      run: echo "C:\mingw64\bin" >> $env:GITHUB_PATH

    - name: Prepare native runtime
      uses: ./.github/actions/native-runtime
