name: 13. _Test Suite (Full)

on:
  workflow_call:
    inputs:
      os_json:
        description: 'JSON string of OS to run on'
        required: false
        type: string
        default: '["ubuntu-24.04", "macos-14", "windows-latest"]'
      python_json:
        description: 'JSON string of Python versions'
        required: false
        type: string
        default: '["3.10", "3.11", "3.12", "3.13"]'
  workflow_dispatch:
    inputs:
      os_json:
        description: 'JSON string of OS to run on'
        required: false
        default: '["ubuntu-24.04", "macos-14", "windows-latest"]'
      python_json:
        description: 'JSON string of Python versions'
        required: false
        default: '["3.10", "3.11", "3.12", "3.13"]'

jobs:
  test:
    name: Full Test (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJson(inputs.os_json || '["ubuntu-24.04", "macos-14", "windows-latest"]') }}
        python-version: ${{ fromJson(inputs.python_json || '["3.10", "3.11", "3.12", "3.13"]') }}

    services:
      redis:
        # Docker services are available on the Ubuntu runners in this matrix.
        image: ${{ startsWith(matrix.os, 'ubuntu-') && 'redis:7.2.7' || '' }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true

    - name: Install system dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential

    - name: Install system dependencies (macOS)
      if: runner.os == 'macOS'
      run: brew install cmake

    - name: Install system dependencies (Windows)
      if: runner.os == 'Windows'
      run: |
        choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System'
        choco install mingw

    - name: Add MinGW to PATH (Windows)
      if: runner.os == 'Windows'
      run: echo "C:\mingw64\bin" >> $env:GITHUB_PATH

    - name: Install Python dependencies
      run: uv sync --frozen --extra test --extra gemini

    - name: Install build dependencies
      run: uv pip install setuptools setuptools_scm cmake wheel

    - name: Check ragfs-python workspace build
      run: cargo check --locked -p ragfs-python

    - name: Build C++ extensions
      run: uv run python setup.py build_ext --inplace

    - name: Run Python unit tests
      run: uv run pytest -q -o addopts='' tests/unit

    - name: Run local filesystem binding regressions
      if: runner.os == 'Linux'
      run: |
        uv run pytest -q -o addopts='' \
          tests/agfs/test_fs_binding.py \
          tests/agfs/test_git_binding.py \
          tests/agfs/test_async_client.py \
          tests/pyagfs

    - name: Run local Python subsystem regressions
      if: runner.os == 'Linux'
      # These suites use mocks or local stores. The HTTP snapshot fixture starts
      # a full service from the user's ov.conf, so it belongs to integration CI.
      run: |
        uv run pytest -q -o addopts='' -m 'not integration and not cli_remote' \
          tests/client tests/config tests/connector tests/ingest tests/models \
          tests/observability tests/parse tests/prompts tests/retrieve \
          tests/storage tests/telemetry tests/transaction tests/vectordb \
          --ignore=tests/client/test_git_versioning_http.py

    - name: Run gateway regressions with Redis
      if: runner.os == 'Linux'
      env:
        OV_TEST_REDIS: redis://127.0.0.1:6379
      # Gateway modules import their own conftest; run them in a separate process.
      run: |
        uv run python -c "import os, redis; assert redis.Redis.from_url(os.environ['OV_TEST_REDIS']).ping()"
        uv run pytest -q -o addopts='' tests/gateway

    - name: Run metrics regressions
      if: runner.os == 'Linux'
      run: uv run pytest -q -o addopts='' tests/metrics

    - name: Run Python binding Rust tests
      if: runner.os == 'Linux'
      env:
        PYTHONPATH: .
      # Test executables link to Python; extension-module disables that linking.
      run: |
        export PYO3_PYTHON="$(uv run python -c 'import sys; print(sys.executable)')"
        uv run cargo test --locked -p ragfs-python --no-default-features

    - name: Run native C++ engine tests
      if: runner.os == 'Linux'
      run: |
        cmake -S tests/engine -B tests/engine/build
        cmake --build tests/engine/build --parallel 2
        tests/engine/build/test_common
        tests/engine/build/test_index_engine
