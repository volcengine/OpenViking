name: 13. _Test Suite (Full)

on:
  workflow_call:
    inputs:
      os_json:
        description: 'JSON string of OS to run on'
        required: false
        type: string
        default: '["ubuntu-24.04", "macos-14", "windows-latest"]'
      python_json:
        description: 'JSON string of Python versions'
        required: false
        type: string
        default: '["3.10", "3.11", "3.12", "3.13"]'
  workflow_dispatch:
    inputs:
      os_json:
        description: 'JSON string of OS to run on'
        required: false
        default: '["ubuntu-24.04", "macos-14", "windows-latest"]'
      python_json:
        description: 'JSON string of Python versions'
        required: false
        default: '["3.10", "3.11", "3.12", "3.13"]'

jobs:
  test:
    name: Full Test (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJson(inputs.os_json || '["ubuntu-24.04", "macos-14", "windows-latest"]') }}
        python-version: ${{ fromJson(inputs.python_json || '["3.10", "3.11", "3.12", "3.13"]') }}

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true

    - name: Install system dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential

    - name: Install system dependencies (macOS)
      if: runner.os == 'macOS'
      run: brew install cmake

    - name: Install system dependencies (Windows)
      if: runner.os == 'Windows'
      run: |
        choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System'
        choco install mingw

    - name: Add MinGW to PATH (Windows)
      if: runner.os == 'Windows'
      run: echo "C:\mingw64\bin" >> $env:GITHUB_PATH

    - name: Prepare native runtime
      uses: ./.github/actions/native-runtime

    - name: Install optional Gemini test dependencies
      run: uv sync --frozen --extra test --extra gemini --no-install-project --inexact

    - name: Create isolated test configuration
      # Exercise config-dependent defaults without user files or model credentials.
      shell: python
      run: |
        import json
        import os
        from pathlib import Path

        config_path = Path(os.environ["RUNNER_TEMP"]) / "openviking-test" / "ov.conf"
        workspace = config_path.parent / "workspace"
        workspace.mkdir(parents=True, exist_ok=True)
        config_path.write_text(
            json.dumps({"storage": {"workspace": str(workspace)}}),
            encoding="utf-8",
        )
        with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as env_file:
            env_file.write(f"OPENVIKING_CONFIG_FILE={config_path}\n")

    - name: Run Python unit tests
      run: uv run --no-sync pytest -q -o addopts='' tests/unit

    - name: Run local filesystem binding regressions
      # Broader regressions run on the first selected Python; unit tests cover every version.
      if: runner.os == 'Linux' && matrix.python-version == fromJson(inputs.python_json || '["3.10", "3.11", "3.12", "3.13"]')[0]
      run: |
        uv run --no-sync pytest -q -o addopts='' \
          tests/agfs/test_fs_binding.py \
          tests/agfs/test_git_binding.py \
          tests/agfs/test_async_client.py \
          tests/pyagfs

    - name: Run local Python subsystem regressions
      if: runner.os == 'Linux' && matrix.python-version == fromJson(inputs.python_json || '["3.10", "3.11", "3.12", "3.13"]')[0]
      # These suites use mocks or local stores. The HTTP snapshot fixture starts
      # a full service from the user's ov.conf, so it belongs to integration CI.
      run: |
        uv run --no-sync pytest -q -o addopts='' -m 'not integration and not cli_remote' \
          tests/client tests/config tests/connector tests/ingest tests/models \
          tests/observability tests/parse tests/prompts tests/retrieve \
          tests/storage tests/telemetry tests/transaction tests/vectordb \
          --ignore=tests/client/test_git_versioning_http.py \
          --ignore=tests/vectordb/test_cuvs_config.py \
          --ignore=tests/vectordb/test_cuvs_index.py \
          --ignore=tests/vectordb/test_cuvs_collection.py \
          --ignore=tests/vectordb/test_str_to_uint64.py
      # cuVS regressions run in api_test.yml; Gateway has gateway.yml.

    - name: Run metrics regressions
      if: runner.os == 'Linux' && matrix.python-version == fromJson(inputs.python_json || '["3.10", "3.11", "3.12", "3.13"]')[0]
      run: uv run --no-sync pytest -q -o addopts='' tests/metrics

    - name: Run Python binding Rust tests
      if: runner.os == 'Linux' && matrix.python-version == fromJson(inputs.python_json || '["3.10", "3.11", "3.12", "3.13"]')[0]
      env:
        PYTHONPATH: .
      # Test executables link to Python; extension-module disables that linking.
      run: |
        export PYO3_PYTHON="$(uv run --no-sync python -c 'import sys; print(sys.executable)')"
        uv run --no-sync cargo test --locked -p ragfs-python --no-default-features

    - name: Run native C++ engine tests
      if: runner.os == 'Linux' && matrix.python-version == fromJson(inputs.python_json || '["3.10", "3.11", "3.12", "3.13"]')[0]
      run: |
        cmake -S tests/engine -B tests/engine/build
        cmake --build tests/engine/build --parallel 2
        tests/engine/build/test_common
        tests/engine/build/test_index_engine
