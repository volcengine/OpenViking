name: 19. Docs TOS Deploy

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'frontend/**'
      - '.github/actions/build-ui/**'
      - '.github/workflows/docs-tos.yml'
      # The deploy also publishes the plugin downloads under /dl.
      - 'examples/.claude-plugin/**'
      - 'examples/.agents/**'
      - 'examples/claude-code-memory-plugin/**'
      - 'examples/codex-memory-plugin/**'
      - 'examples/agent-hook-plugin/**'
      - 'examples/opencode-plugin/**'
      - 'examples/pi-coding-agent-extension/**'
      - 'examples/memory-plugin-shared/**'
      - '.github/scripts/**'
  workflow_dispatch:

permissions:
  contents: read

# A newer push to main cancels the deploy still running for an older one.
# A manual run only queues behind a running deploy; it never cancels one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  DOCS_BASE: /
  # Parallel uploads to TOS: the AWS CLI transfer pool and the xargs fan-out.
  TOS_UPLOAD_CONCURRENCY: 32

jobs:
  deploy:
    name: Build and Upload Docs to TOS
    if: github.repository == 'volcengine/OpenViking'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install docs dependencies
        run: npm ci
        working-directory: docs

      - name: Build docs
        run: npm run docs:build
        working-directory: docs
        env:
          VITE_COUNTER_URL: ${{ vars.VITE_COUNTER_URL }}
          VITE_DOCS_SEARCH_URL: ${{ vars.VITE_DOCS_SEARCH_URL }}

      - name: Build UI
        uses: ./.github/actions/build-ui

      - name: Include UI docs in site
        run: |
          mkdir -p docs/.vitepress/dist/ui
          cp -a frontend/docs/doc_build/. docs/.vitepress/dist/ui/

      - name: Build plugin downloads
        run: bash .github/scripts/build-plugin-downloads.sh docs/.vitepress/dist/dl https://docs.openviking.net/dl

      - name: Check TOS configuration
        id: tos_config
        env:
          TOS_ACCESS_KEY: ${{ secrets.TOS_ACCESS_KEY }}
          TOS_SECRET_KEY: ${{ secrets.TOS_SECRET_KEY }}
          TOS_REGION: ${{ secrets.TOS_REGION }}
          TOS_BUCKET: ${{ secrets.TOS_BUCKET }}
          TOS_ENDPOINT: ${{ secrets.TOS_ENDPOINT }}
        run: |
          if [ -n "${TOS_ACCESS_KEY}" ] && [ -n "${TOS_SECRET_KEY}" ] && [ -n "${TOS_REGION}" ] && [ -n "${TOS_BUCKET}" ] && [ -n "${TOS_ENDPOINT}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.tos_config.outputs.configured == 'true'
        id: setup_python
        continue-on-error: true
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install AWS CLI
        if: steps.tos_config.outputs.configured == 'true'
        id: install_aws_cli
        continue-on-error: true
        run: |
          python -m pip install --upgrade awscli
          aws configure set default.s3.addressing_style virtual
          aws configure set default.s3.max_concurrent_requests "${TOS_UPLOAD_CONCURRENCY}"

      - name: Upload docs dist to TOS
        id: upload_tos
        if: steps.tos_config.outputs.configured == 'true'
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.TOS_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TOS_SECRET_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.TOS_REGION }}
          TOS_BUCKET: ${{ secrets.TOS_BUCKET }}
          TOS_ENDPOINT: ${{ secrets.TOS_ENDPOINT }}
        run: |
          set -euo pipefail
          : "${AWS_ACCESS_KEY_ID:?Missing TOS_ACCESS_KEY secret}"
          : "${AWS_SECRET_ACCESS_KEY:?Missing TOS_SECRET_KEY secret}"
          : "${AWS_DEFAULT_REGION:?Missing TOS_REGION secret}"
          : "${TOS_BUCKET:?Missing TOS_BUCKET secret}"
          : "${TOS_ENDPOINT:?Missing TOS_ENDPOINT secret}"

          TOS_ENDPOINT="${TOS_ENDPOINT#https://}"
          TOS_ENDPOINT="${TOS_ENDPOINT#http://}"
          case "${TOS_ENDPOINT}" in
            tos-s3-*) TOS_S3_ENDPOINT="${TOS_ENDPOINT}" ;;
            tos-*) TOS_S3_ENDPOINT="tos-s3-${TOS_ENDPOINT#tos-}" ;;
            *) TOS_S3_ENDPOINT="${TOS_ENDPOINT}" ;;
          esac

          DIST_DIR="docs/.vitepress/dist"
          HTML_CACHE_CONTROL="public, max-age=0, must-revalidate"
          STATIC_CACHE_CONTROL="public, max-age=31536000, immutable"
          NO_CACHE_CONTROL="no-store, no-cache, must-revalidate, max-age=0"

          # Upload hashed assets before any HTML. A page whose new HTML lands
          # before its chunk renders VitePress's 404 until the chunk arrives.
          aws s3 cp "${DIST_DIR}/assets" "s3://${TOS_BUCKET}/assets/" \
            --endpoint-url "https://${TOS_S3_ENDPOINT}" \
            --recursive \
            --cache-control "${STATIC_CACHE_CONTROL}" \
            --only-show-errors

          # UI assets may be nested outside the main site's assets directory.
          # Publish every non-HTML UI resource first. Revalidate their stable
          # URLs rather than assuming every file has a content hash.
          aws s3 cp "${DIST_DIR}/ui" "s3://${TOS_BUCKET}/ui/" \
            --endpoint-url "https://${TOS_S3_ENDPOINT}" \
            --recursive \
            --exclude "*.html" \
            --cache-control "${HTML_CACHE_CONTROL}" \
            --only-show-errors

          aws s3 cp "${DIST_DIR}" "s3://${TOS_BUCKET}/" \
            --endpoint-url "https://${TOS_S3_ENDPOINT}" \
            --recursive \
            --exclude ".git/*" \
            --exclude "assets/*" \
            --exclude "dl/*" \
            --exclude "ui/*" \
            --cache-control "${HTML_CACHE_CONTROL}" \
            --only-show-errors

          aws s3 cp "${DIST_DIR}/ui" "s3://${TOS_BUCKET}/ui/" \
            --endpoint-url "https://${TOS_S3_ENDPOINT}" \
            --recursive \
            --exclude "*" \
            --include "*.html" \
            --cache-control "${HTML_CACHE_CONTROL}" \
            --only-show-errors

          # The recursive copies above fan out through the AWS CLI's own transfer
          # pool (s3.max_concurrent_requests). The per-object copies below start
          # one aws process per file, so run them through xargs with the same
          # fan-out. xargs exits non-zero when any copy fails and pipefail passes
          # that on, so a failed upload still fails this step.
          export DIST_DIR TOS_BUCKET TOS_S3_ENDPOINT HTML_CACHE_CONTROL NO_CACHE_CONTROL

          upload_html_alias() {
            aws s3 cp "$1" "s3://${TOS_BUCKET}/$2" \
              --endpoint-url "https://${TOS_S3_ENDPOINT}" \
              --content-type "text/html; charset=utf-8" \
              --cache-control "${HTML_CACHE_CONTROL}" \
              --only-show-errors
          }

          upload_site_html_alias() {
            local rel_path="${1#${DIST_DIR}/}"
            case "${rel_path}" in
              # UI uses its own generated routes; don't create main-site
              # clean-URL aliases (especially an object at /ui).
              index.html|404.html|ui/*) return 0 ;;
            esac

            upload_html_alias "$1" "${rel_path%.html}"
          }

          upload_ui_html_alias() {
            local rel_path="${1#${DIST_DIR}/}"
            case "${rel_path}" in
              ui/index.html|ui/404.html|*/index.html) return 0 ;;
            esac

            upload_html_alias "$1" "${rel_path%.html}"
          }

          upload_agent_file() {
            aws s3 cp "$1" "s3://${TOS_BUCKET}/agents/${1#${DIST_DIR}/agents/}" \
              --endpoint-url "https://${TOS_S3_ENDPOINT}" \
              --content-type "$2" \
              --content-disposition "inline" \
              --cache-control "${NO_CACHE_CONTROL}" \
              --only-show-errors
          }

          export -f upload_html_alias upload_site_html_alias upload_ui_html_alias upload_agent_file

          find "${DIST_DIR}" -type f -name "*.html" -print0 |
            xargs -0 -r -n 1 -P "${TOS_UPLOAD_CONCURRENCY}" bash -c 'upload_site_html_alias "$1"' _

          # Rspress may emit leaf.html for extensionless links. Keep those
          # aliases inside /ui; directory index pages retain their index route.
          # Never create an object at /ui that could shadow the site's prefix.
          find "${DIST_DIR}/ui" -type f -name "*.html" -print0 |
            xargs -0 -r -n 1 -P "${TOS_UPLOAD_CONCURRENCY}" bash -c 'upload_ui_html_alias "$1"' _

          if [ -d "${DIST_DIR}/agents" ]; then
            aws s3 cp "${DIST_DIR}/agents" "s3://${TOS_BUCKET}/agents/" \
              --endpoint-url "https://${TOS_S3_ENDPOINT}" \
              --recursive \
              --cache-control "${NO_CACHE_CONTROL}" \
              --only-show-errors

            find "${DIST_DIR}/agents" -type f -name "*.json" -print0 |
              xargs -0 -r -n 1 -P "${TOS_UPLOAD_CONCURRENCY}" \
                bash -c 'upload_agent_file "$1" "application/json; charset=utf-8"' _

            find "${DIST_DIR}/agents" -type f -name "*.md" -print0 |
              xargs -0 -r -n 1 -P "${TOS_UPLOAD_CONCURRENCY}" \
                bash -c 'upload_agent_file "$1" "text/markdown; charset=utf-8"' _
          fi

      - name: Upload plugin downloads to TOS
        id: upload_downloads
        if: steps.tos_config.outputs.configured == 'true'
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.TOS_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TOS_SECRET_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.TOS_REGION }}
          TOS_BUCKET: ${{ secrets.TOS_BUCKET }}
          TOS_ENDPOINT: ${{ secrets.TOS_ENDPOINT }}
        run: |
          set -euo pipefail

          TOS_ENDPOINT="${TOS_ENDPOINT#https://}"
          TOS_ENDPOINT="${TOS_ENDPOINT#http://}"
          case "${TOS_ENDPOINT}" in
            tos-s3-*) TOS_S3_ENDPOINT="${TOS_ENDPOINT}" ;;
            tos-*) TOS_S3_ENDPOINT="tos-s3-${TOS_ENDPOINT#tos-}" ;;
            *) TOS_S3_ENDPOINT="${TOS_ENDPOINT}" ;;
          esac

          DL_DIR="docs/.vitepress/dist/dl"
          NO_CACHE_CONTROL="no-store, no-cache, must-revalidate, max-age=0"

          upload() {
            aws s3 cp "${DL_DIR}/$1" "s3://${TOS_BUCKET}/dl/$1" \
              --endpoint-url "https://${TOS_S3_ENDPOINT}" \
              --content-type "$2" \
              --cache-control "${NO_CACHE_CONTROL}" \
              --only-show-errors
          }

          upload memory-plugin-shared/install.sh "text/plain; charset=utf-8"
          upload memory-plugin-shared/bootstrap.sh "text/plain; charset=utf-8"
          upload memory-plugin-shared/import-history.mjs "text/javascript; charset=utf-8"
          upload releases/latest/memory-plugin-marketplace.zip application/zip
          # The manifest and the refs go up after the files they point to.
          for zip in "${DL_DIR}"/plugins/claude/*.zip; do
            upload "plugins/claude/$(basename "${zip}")" application/zip
          done
          upload plugins/claude/marketplace.json application/json
          bash .github/scripts/publish-dumb-git-repo.sh "${DL_DIR}/plugins/memory-plugins.git" \
            "s3://${TOS_BUCKET}/dl/plugins/memory-plugins.git" --endpoint-url "https://${TOS_S3_ENDPOINT}"
          upload releases/latest/channels.json application/json

      - name: Report TOS deployment failure
        if: steps.setup_python.outcome == 'failure' || steps.install_aws_cli.outcome == 'failure' || steps.upload_tos.outcome == 'failure' || steps.upload_downloads.outcome == 'failure'
        run: |
          echo "::warning::Docs were built, but deploying to TOS failed. This deployment is non-blocking."
          echo "## TOS deployment failed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Docs build succeeded, but setting up TOS tooling or uploading docs/.vitepress/dist failed. This workflow keeps passing so TOS availability does not block other repository flows." >> "$GITHUB_STEP_SUMMARY"

      - name: Report skipped TOS upload
        if: steps.tos_config.outputs.configured != 'true'
        run: |
          echo "## TOS upload skipped" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Docs build succeeded, but TOS secrets are not fully configured for this repository. Upload was skipped without failing the workflow." >> "$GITHUB_STEP_SUMMARY"
