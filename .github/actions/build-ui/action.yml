name: Build UI
description: Install, type-check, and build the UI library and documentation
runs:
  using: composite
  steps:
    - name: Set up Node.js for UI
      uses: actions/setup-node@v6
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    - name: Install UI dependencies
      shell: bash
      run: npm ci --prefix frontend

    - name: Check UI formatting
      shell: bash
      run: npm run format:check --prefix frontend

    - name: Type-check UI
      shell: bash
      run: npm run check --prefix frontend

    - name: Build UI library and docs
      shell: bash
      run: npm run build --prefix frontend

    - name: Check UI docs output
      shell: bash
      run: test -f frontend/docs/doc_build/index.html
